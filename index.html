<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<meta name="description" content="Stackd compares sportsbook odds across every book in your state, prices your parlay at each one, and tracks how your picks actually performed." />
<title>Stackd V1.6 — every book, one board</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101A33'/%3E%3Crect x='7' y='20' width='9' height='4' rx='1.4' fill='%23FFFFFF' opacity='.45'/%3E%3Crect x='7' y='14' width='14' height='4' rx='1.4' fill='%23FFFFFF' opacity='.7'/%3E%3Crect x='7' y='8' width='19' height='4' rx='1.4' fill='%23FF5A45'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Instrument+Sans:wght@400..700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@layer tokens, base, layout, brand, components, utilities;

@layer tokens {
  @property --ticker-shift { syntax: '<length>'; inherits: false; initial-value: 0px; }

  :root{
    /* Coral is reserved for one meaning only: this is the best available price. */
    --ink:      #101A33;
    --ink-soft: #1B2A4A;
    --flare:    #FF5A45;
    --paper:    #F4F6FA;
    --card:     #FFFFFF;
    --slate:    #5C6B85;
    --slate-lo: #8B97AC;
    --line:     #DDE3ED;
    --mint:     #12B981;
    --rust:     #C23B2A;
    --gold:     #B8730A;

    --tint-flare: color-mix(in srgb, var(--flare) 10%, transparent);
    --tint-mint:  color-mix(in srgb, var(--mint) 12%, transparent);
    --tint-rust:  color-mix(in srgb, var(--rust) 9%, transparent);
    --tint-gold:  color-mix(in srgb, var(--gold) 11%, transparent);

    --display: 'Archivo', system-ui, sans-serif;
    --body:    'Instrument Sans', system-ui, sans-serif;
    --data:    'DM Mono', ui-monospace, monospace;

    --r-card: 12px;
    --r-ctl:  7px;

    --sh-card: 0 1px 2px rgb(16 26 51 / .04), 0 10px 28px -16px rgb(16 26 51 / .16);
    --sh-pop:  0 2px 6px rgb(16 26 51 / .08), 0 24px 56px -20px rgb(16 26 51 / .34);

    --gut: clamp(16px, 4vw, 28px);
    --max: 1140px;
  }
}

@layer base {
  *, *::before, *::after { box-sizing: border-box; }

  html { scrollbar-gutter: stable; }

  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--body); font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  h1,h2,h3,h4{ font-family:var(--display); margin:0; text-wrap:balance; letter-spacing:-.02em; }

  button{ font-family:inherit; cursor:pointer; }

  input, select{
    font-family:inherit; font-size:14px; color:var(--ink);
    background:var(--paper); border:1px solid var(--line);
    border-radius:var(--r-ctl); padding:9px 11px;

    &:focus-visible{ outline:2px solid var(--ink); outline-offset:1px; border-color:var(--ink); }
  }

  :is(button, a, summary, [tabindex]):focus-visible{
    outline:2px solid var(--flare); outline-offset:2px; border-radius:4px;
  }

  ::selection{ background:var(--tint-flare); }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:5px; }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }
}

@layer layout {
  .shell{ max-width:var(--max); margin:0 auto; padding-inline:var(--gut); }

  main{ padding-block:32px 200px; }

  .stack-lg > * + *{ margin-top:28px; }
}

/* ---------- brand: masthead, logo, ticker, footer ---------- */
@layer brand {
  .masthead{
    background:var(--ink);
    color:#fff;
    position:sticky; top:0; z-index:40;
    box-shadow:0 1px 0 rgb(255 255 255 / .06), 0 6px 24px -12px rgb(16 26 51 / .5);
  }

  .masthead-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:20px; padding-block:15px; flex-wrap:wrap;
  }

  .brandmark{
    display:flex; align-items:center; gap:11px;
    text-decoration:none; color:#fff; flex-shrink:0;
  }
  .brandmark svg{ display:block; }
  .wordmark{
    font-family:var(--display);
    font-variation-settings:'wdth' 112;
    font-weight:800; font-size:23px; letter-spacing:-.035em;
    line-height:1;
  }
  .wordmark i{ color:var(--flare); font-style:normal; }
  .tagline{
    font-size:10px; text-transform:uppercase; letter-spacing:.16em;
    color:rgb(255 255 255 / .42); font-weight:600; margin-top:3px;
  }

  .mast-nav{ display:flex; gap:2px; flex-wrap:wrap; }
  .mast-nav button{
    background:none; border:none; color:rgb(255 255 255 / .58);
    font-size:13px; font-weight:600; padding:8px 13px; border-radius:var(--r-ctl);
    transition:color .16s, background .16s;

    &:hover{ color:#fff; background:rgb(255 255 255 / .07); }
    &[aria-current="page"]{ color:var(--ink); background:#fff; }
  }

  .mast-right{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }

  /* --- signature: the line ticker --- */
  .ticker{
    border-top:1px solid rgb(255 255 255 / .09);
    overflow:hidden; position:relative;
    background:linear-gradient(180deg, rgb(0 0 0 / .18), transparent);

    &::after{
      content:""; position:absolute; inset:0; pointer-events:none;
      background:linear-gradient(90deg, var(--ink) 0%, transparent 7%, transparent 93%, var(--ink) 100%);
    }
    &:hover .ticker-track{ animation-play-state:paused; }
  }
  .ticker-track{
    display:flex; gap:0; width:max-content;
    animation:ticker-run 64s linear infinite;
    padding-block:9px;
  }
  @keyframes ticker-run{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }

  .tick{
    display:inline-flex; align-items:baseline; gap:7px;
    padding-inline:16px; white-space:nowrap;
    border-right:1px solid rgb(255 255 255 / .08);
  }
  .tick-team{
    font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
    color:rgb(255 255 255 / .5);
  }
  .tick-price{
    font-family:var(--data); font-variant-numeric:tabular-nums;
    font-size:12.5px; font-weight:500; color:#fff;
  }
  .tick-price.up{ color:var(--flare); }
  .tick-book{ font-size:9.5px; color:rgb(255 255 255 / .3); letter-spacing:.06em; text-transform:uppercase; }

  .ticker-idle{
    padding-block:9px; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:rgb(255 255 255 / .3); font-weight:600;
  }

  /* --- page masthead for editorial pages --- */
  .page-head{ padding-block:14px 34px; border-bottom:1px solid var(--line); margin-bottom:34px; }
  .eyebrow{
    font-size:10.5px; font-weight:700; letter-spacing:.17em; text-transform:uppercase;
    color:var(--flare); margin-bottom:14px;
  }
  .page-title{
    font-variation-settings:'wdth' 108;
    font-weight:900; font-size:clamp(2.3rem, 6.2vw, 3.9rem);
    line-height:.96; letter-spacing:-.038em; margin-bottom:16px;
  }
  .page-lede{
    font-size:clamp(1rem, 2.1vw, 1.15rem); line-height:1.62; color:var(--slate);
    max-width:63ch;
  }

  .site-foot{
    border-top:1px solid var(--line); background:var(--ink); color:rgb(255 255 255 / .62);
    padding-block:38px 46px; margin-top:64px;
  }
  .foot-grid{ display:flex; justify-content:space-between; gap:34px; flex-wrap:wrap; }
  .foot-legal{ font-size:11.5px; line-height:1.85; max-width:56ch; }
  .foot-legal strong{ color:rgb(255 255 255 / .88); font-weight:600; }
  .foot-21{
    display:inline-flex; align-items:center; gap:8px; margin-top:14px;
    font-size:11px; letter-spacing:.05em;
    border:1px solid rgb(255 255 255 / .18); border-radius:999px; padding:5px 12px;
    color:rgb(255 255 255 / .8);
  }
  .foot-21 b{ font-family:var(--display); font-weight:800; }
}

@layer components {
  /* --- controls --- */
  .toolbar{ display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:14px; }

  /* --- differentiator banner --- */
  .pitch{
    background:var(--card); border:1px solid var(--line); border-left:3px solid var(--flare);
    border-radius:var(--r-card); padding:15px 18px; margin-bottom:18px;
  }
  .pitch h2{ font-size:15px; font-weight:800; margin-bottom:5px; }
  .pitch p{ margin:0; font-size:13.5px; line-height:1.6; color:var(--slate); }
  .pitch b{ color:var(--ink); font-weight:600; }

  /* --- search --- */
  .searchbar{ position:relative; flex:1; min-width:180px; }
  .searchbar input{ width:100%; padding-left:32px; }
  .searchbar::before{
    content:"⌕"; position:absolute; left:11px; top:50%; transform:translateY(-50%);
    color:var(--slate-lo); font-size:15px; pointer-events:none;
  }
  .searchclear{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--slate-lo); font-size:15px; line-height:1; padding:3px;
    &:hover{ color:var(--ink); }
  }

  .depth{
    font-family:var(--body); font-size:10px; font-weight:600; letter-spacing:.04em;
    text-transform:none; color:var(--slate-lo); margin-left:9px;
  }

  /* --- player search scan controls --- */
  .scan-setup{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r-card);
    padding:14px 16px; margin-bottom:14px;
  }
  .scan-row{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-top:10px; }
  .scan-row label{ font-size:12px; font-weight:600; color:var(--slate); }
  .scan-row select{ padding:6px 26px 6px 9px; font-size:12.5px; }
  .scan-note{ font-size:11.5px; color:var(--slate-lo); }

  /* --- player search --- */
  .psearch-hit{
    background:var(--card); border:1px solid var(--line); border-radius:var(--r-ctl);
    padding:10px 13px; margin-bottom:7px; display:flex; justify-content:space-between;
    gap:10px; align-items:center; width:100%; text-align:left;
    &:hover{ border-color:var(--ink); }
  }
  .psearch-hit .nm{ font-size:13.5px; font-weight:600; }
  .psearch-hit .ctx{ font-size:11.5px; color:var(--slate); }
  .implied{
    font-family:var(--data); font-size:11.5px; color:var(--slate);
    font-variant-numeric:tabular-nums;
  }

  /* --- sport tiles --- */
  .sportbar{ margin-bottom:15px; }
  .tiles{ display:flex; gap:8px; flex-wrap:wrap; align-items:stretch; }
  .tile{
    position:relative; display:flex; flex-direction:column; gap:2px; align-items:flex-start;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:9px 14px 9px 12px; min-width:78px;
    transition:border-color .15s, background .15s, transform .12s;

    &:hover{ border-color:var(--ink); }
    &[aria-pressed="true"]{ background:var(--ink); border-color:var(--ink); color:#fff; }
  }
  .tile-name{ font-family:var(--display); font-weight:800; font-size:14px; letter-spacing:-.01em; }
  .tile-sub{ font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--slate-lo); }
  .tile[aria-pressed="true"] .tile-sub{ color:rgb(255 255 255 / .5); }
  .fav-star{
    position:absolute; top:5px; right:6px; line-height:1;
    background:none; border:none; padding:2px; font-size:11px;
    color:var(--slate-lo); opacity:.55; transition:opacity .15s, color .15s;
    &:hover{ opacity:1; color:var(--flare); }
    &[data-on="true"]{ opacity:1; color:var(--flare); }
  }
  .tile[aria-pressed="true"] .fav-star{ color:rgb(255 255 255 / .5); }
  .tile[aria-pressed="true"] .fav-star[data-on="true"]{ color:var(--flare); }
  .tile-more{
    background:var(--paper); border:1px dashed var(--line); border-radius:10px;
    padding:9px 14px; font-size:12.5px; font-weight:600; color:var(--slate);
    &:hover{ border-color:var(--ink); color:var(--ink); }
  }
  .tile-drawer{
    margin-top:9px; padding:12px; border:1px solid var(--line); border-radius:10px;
    background:var(--card); display:flex; gap:7px; flex-wrap:wrap;
  }
  .quota-line{
    font-size:11.5px; color:var(--slate); display:flex; align-items:center; gap:7px;
    margin:0 0 10px;
  }
  .quota-pip{ display:inline-flex; gap:3px; }
  .quota-pip i{ width:7px; height:7px; border-radius:50%; background:var(--line); display:block; }
  .quota-pip i[data-used="false"]{ background:var(--flare); }

  .seg{ display:flex; background:var(--card); border:1px solid var(--line); border-radius:var(--r-ctl); padding:2px; }
  .seg button{
    background:none; border:none; color:var(--slate);
    font-size:12.5px; font-weight:600; padding:7px 13px; border-radius:5px;
    transition:background .15s, color .15s;

    &:hover{ color:var(--ink); }
    &[aria-pressed="true"]{ background:var(--ink); color:#fff; }
  }

  .btn{
    display:inline-flex; align-items:center; gap:7px;
    font-size:12.5px; font-weight:600; padding:8px 14px;
    border-radius:var(--r-ctl); border:1px solid var(--line);
    background:var(--card); color:var(--ink);
    transition:border-color .15s, background .15s;

    &:hover:not(:disabled){ border-color:var(--ink); }
    &:disabled{ opacity:.42; cursor:default; }
  }
  .btn-solid{
    background:var(--ink); color:#fff; border-color:var(--ink);
    &:hover:not(:disabled){ background:#1e2c4d; }
  }
  .btn-flare{
    background:var(--flare); color:#fff; border-color:var(--flare);
    &:hover:not(:disabled){ filter:brightness(1.07); }
  }

  .select-native{ appearance:none; padding-right:30px;
    background-image:linear-gradient(45deg, transparent 50%, var(--slate) 50%), linear-gradient(135deg, var(--slate) 50%, transparent 50%);
    background-position:calc(100% - 15px) center, calc(100% - 10px) center;
    background-size:5px 5px, 5px 5px; background-repeat:no-repeat;
  }

  /* Developer diagnostics panel. Visually set apart from the user's own
     settings so there's no chance of reading these numbers as something the
     account holder is meant to act on. */
  .devpanel{
    margin:18px 0 4px; padding:14px 15px 15px;
    border:1px solid var(--line); border-radius:var(--r-card);
    background:color-mix(in srgb, var(--ink) 3%, var(--paper));
  }
  .devpanel-h{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin:0 0 4px;
  }
  .devpanel-h h4{
    margin:0; font-size:12px; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; color:var(--slate);
  }
  .devsec{
    margin:14px 0 4px; font-size:10.5px; font-weight:700; letter-spacing:.09em;
    text-transform:uppercase; color:var(--slate-lo);
    border-top:1px solid var(--line); padding-top:9px;
  }
  .devsec:first-of-type{ border-top:0; padding-top:0; }
  .devpanel .cmp{ font-size:12px; }
  .devpanel .implied{ font-family:var(--data); font-size:11.5px; }

  /* V1.5 — freshness and cost of the last feed read. Coral stays reserved for
     "best available price", so this uses mint for cached and gold for a fresh
     pull rather than borrowing the accent. */
  .feed{
    display:flex; align-items:center; flex-wrap:wrap; gap:8px;
    margin:-6px 0 16px; font-size:12px; color:var(--slate); line-height:1.5;
  }
  .feed-pip{
    display:inline-flex; align-items:center; gap:6px;
    padding:3px 9px; border-radius:999px; white-space:nowrap;
    border:1px solid var(--line); background:var(--card);
    font-weight:600; color:var(--ink);
  }
  .feed-pip::before{
    content:""; width:6px; height:6px; border-radius:50%; background:var(--slate-lo);
  }
  .feed-pip[data-state="cached"]{
    background:var(--tint-mint);
    border-color:color-mix(in srgb, var(--mint) 38%, var(--line));
  }
  .feed-pip[data-state="cached"]::before{ background:var(--mint); }
  .feed-pip[data-state="fresh"]{
    background:var(--tint-gold);
    border-color:color-mix(in srgb, var(--gold) 38%, var(--line));
  }
  .feed-pip[data-state="fresh"]::before{ background:var(--gold); }
  .feed-debug{
    font-family:var(--data); font-size:11px; color:var(--slate-lo);
    width:100%;
  }

  .note{ font-size:12.5px; color:var(--slate); margin:0 0 16px; line-height:1.6; }
  .note strong{ color:var(--ink); font-weight:600; }

  .alert{
    display:flex; gap:9px; align-items:flex-start;
    background:var(--tint-rust); border:1px solid color-mix(in srgb, var(--rust) 30%, transparent);
    color:var(--rust); font-size:13.5px; border-radius:var(--r-ctl); padding:11px 13px; margin-bottom:18px;
  }
  .blank{
    text-align:center; color:var(--slate); font-size:14px; padding:56px 20px;
    border:1px dashed var(--line); border-radius:var(--r-card); background:color-mix(in srgb, var(--card) 60%, transparent);
  }

  /* --- day divider --- */
  .daybar{ display:flex; align-items:center; gap:13px; margin:30px 0 12px;
    &:first-of-type{ margin-top:0; }
  }
  .daybar span{
    font-family:var(--display); font-weight:800; font-size:13px;
    letter-spacing:.02em; white-space:nowrap;
  }
  .daybar i{ flex:1; height:1px; background:var(--line); }
  .daybar em{
    font-style:normal; font-family:var(--data); font-size:11px; color:var(--slate-lo);
    font-variant-numeric:tabular-nums;
  }

  /* --- game card --- */
  .game{
    container-type:inline-size;
    content-visibility:auto; contain-intrinsic-size:auto 180px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--r-card);
    box-shadow:var(--sh-card); margin-bottom:12px; overflow:clip;
    transition:border-color .18s, box-shadow .18s;

    &:has(details[open]){ border-color:color-mix(in srgb, var(--ink) 24%, var(--line)); }
  }

  .game-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding:15px 17px 0; }
  .matchup{ font-size:16.5px; font-weight:800; letter-spacing:-.025em; line-height:1.25; }
  .matchup i{ font-style:normal; color:var(--slate-lo); font-weight:500; padding-inline:3px; }
  .when{ text-align:right; flex-shrink:0; }
  .when time{ font-family:var(--data); font-size:12px; color:var(--slate); font-variant-numeric:tabular-nums; }
  .livetag{
    display:flex; align-items:center; justify-content:flex-end; gap:5px;
    font-size:9.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--rust);
    &::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--rust); animation:pulse 1.6s ease-in-out infinite; }
  }
  @keyframes pulse{ 50%{ opacity:.25; } }

  /* the primary scannable object: best moneyline per side */
  .prices{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:9px; padding:13px 17px 15px; }
  @container (max-width: 380px){ .prices{ grid-template-columns:1fr; } }

  .price{
    border:1px solid var(--line); border-radius:9px; padding:10px 12px;
    background:color-mix(in srgb, var(--paper) 55%, transparent);
    display:flex; flex-direction:column; gap:1px; position:relative;

    &[data-best="true"]{
      border-color:color-mix(in srgb, var(--flare) 45%, transparent);
      background:var(--tint-flare);
    }
  }
  .price-team{ font-size:12.5px; font-weight:600; color:var(--slate); letter-spacing:-.01em; }
  .price-num{
    font-family:var(--data); font-variant-numeric:tabular-nums;
    font-size:25px; font-weight:500; letter-spacing:-.03em; line-height:1.15;
  }
  .price[data-best="true"] .price-num{ color:var(--flare); }
  .price-book{ font-size:10.5px; color:var(--slate-lo); letter-spacing:.04em; }
  .best-flag{
    position:absolute; top:9px; right:10px;
    font-size:8.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
    color:var(--flare);
  }

  /* native disclosure for the deep view */
  .game details{ border-top:1px solid var(--line); }
  .game summary{
    list-style:none; cursor:pointer; padding:11px 17px;
    font-size:12px; font-weight:600; color:var(--slate);
    display:flex; align-items:center; gap:8px;
    transition:background .15s, color .15s;

    &::-webkit-details-marker{ display:none; }
    &:hover{ background:var(--paper); color:var(--ink); }
  }
  .game summary::before{
    content:"+"; font-family:var(--data); font-size:14px; line-height:1;
    width:17px; height:17px; display:grid; place-items:center;
    border:1px solid var(--line); border-radius:4px; color:var(--ink);
  }
  .game details[open] summary::before{ content:"–"; }

  const bk = source && (source.bookmakers || []).find(b => b.key === bookKey);

  const oc = mkt && (mkt.outcomes || []).find(o => outcomeKeyOf(o) === leg.outcomeKey);

  if(SPORT_LABELS[s.key]) return SPORT_LABELS[s.key];

/* Grades one leg against a /scores event: "win" | "loss" | "push" | "pending" */
function gradeLeg(leg, event){
  if(!event || !event.completed || !Array.isArray(event.scores)) return "pending";
  if(!["h2h","spreads","totals"].includes(leg.market)) return "pending";
  const scores = {};
  for(const s of event.scores) scores[s.name] = Number(s.score);
  const home = event.home_team, away = event.away_team;
  const parts = leg.outcomeKey.split("__");
  const pickName = parts[1], pointStr = parts[2];

  if(leg.market === "h2h"){
    if(pickName === "Draw") return scores[home] === scores[away] ? "win" : "loss";
    const opp = pickName === home ? away : home;
    if(scores[pickName] === undefined || scores[opp] === undefined) return "pending";
    if(scores[pickName] > scores[opp]) return "win";
    if(scores[pickName] < scores[opp]) return "loss";
    return "push";
  }
  if(leg.market === "spreads"){
    const point = parseFloat(pointStr);
    const opp = pickName === home ? away : home;
    if(scores[pickName] === undefined || scores[opp] === undefined || isNaN(point)) return "pending";
    const adj = scores[pickName] + point;
    if(adj > scores[opp]) return "win";
    if(adj < scores[opp]) return "loss";
    return "push";
  }
  if(leg.market === "totals"){
    const point = parseFloat(pointStr);
    if(scores[home] === undefined || scores[away] === undefined || isNaN(point)) return "pending";
    const total = scores[home] + scores[away];
    if(pickName === "Over"){ if(total > point) return "win"; if(total < point) return "loss"; return "push"; }
    if(pickName === "Under"){ if(total < point) return "win"; if(total > point) return "loss"; return "push"; }
  }
  return "pending";
}

function betPL(e){
  if(e.status === "won") return e.payout - e.stake;
  if(e.status === "push") return 0;
  if(e.status === "lost") return -e.stake;
  return null;
}

/* V0.98 — all odds traffic goes through our Cloudflare Worker instead of
   straight to The Odds API. The API key now lives as a secret on the Worker,
   not in this file, and the Worker caches responses so N users cost one
   upstream call rather than N. Same URL shapes as upstream, minus the key. */
/* The SITE is served from stackd.dev-gm-software.workers.dev (static assets).
   The odds PROXY is a separate code Worker — a static-assets Worker can't run
   code, so the two can't share one deployment without a wrangler setup. */
const ODDS_BASE = "https://api.stackdpicks.com";

/* The Odds API answers 401 for BOTH an invalid key and an exhausted quota, so
   the status code alone can't tell you which — V0.99 guessed "key rejected"
   and was wrong whenever credits simply ran out. The body carries the real
   reason, and x-requests-remaining says whether there's any quota left, so
   read those instead of guessing. */
async function apiError(res){
  let body = null;
  try { body = await res.json(); } catch(_) { /* non-JSON error */ }
  const code = (body && (body.error_code || body.errorCode)) || "";
  const msg  = (body && body.message) || "";
  const left = Number(res.headers.get("x-requests-remaining"));
  const noCredits = /OUT_OF_USAGE_CREDITS|USAGE_LIMIT/i.test(code)
    || /credit|quota/i.test(msg)
    || (Number.isFinite(left) && left <= 0);

  if(noCredits){
    /* Deliberately vague: the cause is an account limit on our side, which is
       our problem to fix and nothing the reader can act on. Saying so would
       only invite them to wonder what it costs us. */
    return "Live prices are temporarily unavailable — this is on our end, not yours. Schedules and the league list still work. Try again shortly.";
  }
  if(res.status === 401) return msg || "Live prices are temporarily unavailable — this is on our end, not yours. Try again shortly.";
  if(res.status === 422) return msg || "No book is posting that market for this game.";
  if(res.status === 429) return msg || "Too many requests at once — wait a few seconds and retry.";
  return msg ? `${msg} (HTTP ${res.status})` : `The odds feed returned HTTP ${res.status}.`;
}

/* V1.5 — what the last read of the odds feed actually cost.
   The proxy reports whether it answered from its own cache (x-stackd-cache)
   and which TTL tier it picked (x-stackd-tier: "far" when the earliest game is
   more than two hours out, "live" when it isn't). Surfacing that does two
   jobs: it tells people how fresh the prices are, and it makes plain during
   testing whether a refresh spent anything or cost nothing at all. */
/* Credits bill as markets x regions, so one board read can cost several and a
   scan of eight games is nowhere near eight. Diffing the counter the API
   returns is the only honest measure of what an action cost, and it has to be
   shared across the app because the board and the props scan both spend from
   the same pot. */
const creditTracker = { remaining: null };

/* Counts for this browser session only — they reset on reload and describe
   one person's activity, not the site's. The developer panel labels them that
   way so they are never mistaken for fleet-wide numbers. */
const sessionStats = { reads: 0, hits: 0, misses: 0, spent: 0, startedAt: Date.now() };

function noteCredits(res, cached){
  sessionStats.reads++;
  if(cached) sessionStats.hits++; else sessionStats.misses++;
  /* A cached response carries whatever credit count was current when it was
     first fetched. That number is stale, so trusting it would corrupt every
     later diff — and the honest answer for a cache hit is simply zero. */
  if(cached) return 0;
  /* Number(null) is 0, not NaN — so a missing header would read as "zero
     credits left", report a spend of the entire balance, and poison every
     later diff. Reject absent values before converting. */
  const raw = res.headers.get("x-requests-remaining");
  if(raw === null || raw === "") return null;
  const n = Number(raw);
  if(!Number.isFinite(n)) return null;
  const prev = creditTracker.remaining;
  creditTracker.remaining = n;
  const spent = (prev !== null && prev >= n) ? prev - n : null;
  if(spent !== null) sessionStats.spent += spent;
  return spent;
}

function readFeedMeta(res){
  // Same Number(null) === 0 trap as above: an absent header is unknown, not zero.
  const num = v => {
    if(v === null || v === "") return null;
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
  };
  const cached = res.headers.get("x-stackd-cache") === "HIT";
  const spent = noteCredits(res, cached);
  return {
    cached,
    tier:   res.headers.get("x-stackd-tier"),
    ttl:    num(res.headers.get("x-stackd-ttl")),
    lead:   num(res.headers.get("x-stackd-lead")),
    remaining: creditTracker.remaining,
    spent,
    at: Date.now(),
  };
}

function humanDuration(seconds){
  if(seconds === null || seconds === undefined || seconds < 0) return null;
  if(seconds < 60) return "under a minute";
  const m = Math.round(seconds / 60);
  if(m < 60) return `${m} min`;
  const h = Math.floor(m / 60), rm = m % 60;
  if(h < 24) return rm ? `${h}h ${rm}m` : `${h}h`;
  const d = Math.floor(h / 24);
  return `${d}d ${h % 24}h`;
}

/* Developer diagnostics. Rendered only for accounts with profiles.is_dev, and
   the data behind it is reachable only by those accounts — RLS keeps every
   other user to their own row.

   One limitation is stated in the panel rather than hidden: the odds feed
   reports a single account-wide credit count, and nothing records which user
   triggered which upstream call, so per-user credit attribution cannot be
   shown honestly. The per-user figures are the daily quota counters, which
   are a usable proxy but are browser-written and reset at midnight. */
/* Pure so it can be tested without a browser, a session or a database. */
function computeDevStats(rows, now){
  if(!rows) return null;
  const t = now === undefined ? Date.now() : now;
  const today = new Date(t).toISOString().slice(0, 10);
  const weekAgo = t - 7 * 864e5;

  const active = rows
    .map(r => ({
      who: r.username || r.email || "(unknown)",
      plan: r.plan || "free",
      /* The counters describe today only if the stored date is today.
         Otherwise they're yesterday's leftovers that haven't been reset yet,
         and counting them would overstate activity every morning. */
      searches: r.prop_refresh_date === today ? (r.prop_refresh_count || 0) : 0,
      scans:    r.prop_refresh_date === today ? (r.scan_all_count || 0) : 0,
    }))
    .map(r => ({ ...r, total: r.searches + r.scans }))
    .filter(r => r.total > 0)
    .sort((a, b) => b.total - a.total);

  const totalActions = active.reduce((n, r) => n + r.total, 0);
  return {
    users: rows.length,
    pro: rows.filter(r => r.plan === "pro").length,
    devs: rows.filter(r => r.is_dev).length,
    new7: rows.filter(r => r.created_at && Date.parse(r.created_at) > weekAgo).length,
    active, totalActions,
    topShare: totalActions > 0 && active.length
      ? Math.round((active[0].total / totalActions) * 100) : null,
  };
}

/* How fresh a props scan's prices are. A scan is many single-event reads, so
   the useful summary is how many were already held versus newly pulled.
   Framed as freshness, never as cost — what the feed charges us is our
   business, not something to put in front of a reader. */
function ScanNote({ meta, dev }){
  if(!meta || !meta.games) return null;
  const allCached = meta.cached === meta.games;
  const g = n => `${n} game${n === 1 ? "" : "s"}`;

  return (
    <p className="feed">
      <span className="feed-pip" data-state={allCached ? "cached" : "fresh"}>
        {allCached ? "Held prices" : meta.cached ? `${meta.fresh} of ${meta.games} newly pulled` : "Fresh prices"}
      </span>
      <span>
        {allCached
          ? `Scanned ${g(meta.games)} from prices already loaded — nothing has moved since the last check.`
          : `Scanned ${g(meta.games)}, ${meta.fresh} pulled fresh just now.`}
      </span>
      {dev && (
        <span className="feed-debug">
          games={meta.games} cached={meta.cached} fresh={meta.fresh}
          {meta.spent !== null && ` spent=${meta.spent}`}
          {meta.remaining !== null && ` left=${meta.remaining}`}
        </span>
      )}
    </p>
  );
}

/* How fresh the board is, and whether refreshing it costs anything.
   Request diagnostics are shown only to a developer account, never to users:
   they describe our request mechanics and tell a reader nothing they can act
   on. Gated on a profile column rather than a URL flag, since a link can be
   shared or guessed. */
function FeedNote({ meta, dev }){
  const [, tick] = useState(0);
  // Re-render periodically so "read 4 min ago" doesn't freeze at "just now".
  useEffect(() => {
    const id = setInterval(() => tick(n => n + 1), 30000);
    return () => clearInterval(id);
  }, []);

  if(!meta) return null;

  const ageSec = Math.round((Date.now() - meta.at) / 1000);
  const ageText = ageSec < 45 ? "just now" : `${humanDuration(ageSec)} ago`;
  const far = meta.tier === "far";
  const held = humanDuration(meta.ttl);
  /* Only explain the caching when the proxy actually told us which tier it
     chose. Without that header we know nothing about kickoff times, and
     guessing "a game starts soon" would be a confident lie about how fresh
     these prices are. */
  const known = meta.tier === "far" || meta.tier === "live";

  return (
    <p className="feed">
      <span className="feed-pip" data-state={meta.cached ? "cached" : "fresh"}>
        {meta.cached ? "From cache" : "Fresh prices"}
      </span>
      <span>
        Read {ageText}.
        {known && " "}
        {known && (far
          ? `No game starts for ${humanDuration(meta.lead) || "a while"}, so prices are held${held ? ` for ${held}` : ""} — refreshing won't pull new odds.`
          : "A game starts within two hours, so each refresh pulls live prices.")}
      </span>
      {dev && (
        <span className="feed-debug">
          tier={meta.tier || "?"} ttl={meta.ttl ?? "?"}s {meta.cached ? "HIT" : "MISS"}
          {meta.spent !== null && ` spent=${meta.spent}`}
          {meta.remaining !== null && ` left=${meta.remaining}`}
        </span>
      )}
    </p>
  );
}

/* Closing line value: how your locked price compares to where the line closed.
   Positive means you beat the close — the metric that actually predicts whether
   someone is picking well, independent of short-run luck. */
function clvPercent(lockedAmerican, closeAmerican){
  if(lockedAmerican == null || closeAmerican == null) return null;
  const mine = americanToDecimal(lockedAmerican);
  const close = americanToDecimal(closeAmerican);
  if(!isFinite(mine) || !isFinite(close) || close <= 1) return null;
  return (mine / close - 1) * 100;
}

    if(error) return error.message;
    await refreshProfile();
    return null;
  };

  const addLedgerEntry = async (entry) => {
    const { data, error } = await sb.from("ledger_entries").insert({
      user_id: session.user.id, book: entry.book, legs: entry.legs,
      book_comparison: entry.bookComparison, stake: entry.stake,
      american_odds: entry.americanOdds, boost_pct: entry.boostPct,
      payout: entry.payout, status: entry.status,
    }).select().single();
    if(error) return error;
    setLedger(prev => [mapEntryFromDB(data), ...prev]);
    return null;
  };

  const updateLedgerEntry = async (id, patch) => {
    const { data, error } = await sb.from("ledger_entries").update(patch).eq("id", id).select().single();
    if(error) return error;
    setLedger(prev => prev.map(e => e.id === id ? mapEntryFromDB(data) : e));
    return null;
  };

  /* Free-plan prop quotas, split in V0.95: single-game loads and full scans have
     separate daily allowances that reset together. Soft limits — the counts live
     in columns the browser can write, so they're properly enforceable only once
     the odds proxy exists. */
  const todayISO = () => new Date().toISOString().slice(0,10);
  const sameDay = profile?.prop_refresh_date === todayISO();

  const gameSearchesUsed = sameDay ? (profile?.prop_refresh_count || 0) : 0;
  const fullScansUsed    = sameDay ? (profile?.scan_all_count || 0) : 0;
  const gameSearchesLeft = Math.max(0, FREE_GAME_SEARCHES - gameSearchesUsed);
  const fullScansLeft    = Math.max(0, FREE_FULL_SCANS - fullScansUsed);

  // kind: "game" (one game's props) | "scan" (scan upcoming)
  const consumePropRefresh = async (kind = "game") => {
    if(!session) return;
    const patch = { prop_refresh_date: todayISO() };
    // A new day zeroes whichever counter isn't being incremented.
    patch.prop_refresh_count = (kind === "game" ? gameSearchesUsed + 1 : gameSearchesUsed);
    patch.scan_all_count     = (kind === "scan" ? fullScansUsed + 1    : fullScansUsed);
    await sb.from("profiles").update(patch).eq("id", session.user.id);
    await refreshProfile();
  };

  return {
    session, profile, ledger, authReady,
    signedIn: !!session,
    username: profile?.username || session?.user?.email || null,
    email: session?.user?.email || null,
    homeState: profile?.home_state || "ALL",
    isPro: profile?.plan === "pro",
    /* Developer view: shows request diagnostics that are meaningless to users.
       Lives in a column the browser cannot write (see migration 6), so it
       can't be switched on from the console the way a URL flag could. */
    isDev: profile?.is_dev === true,
    favoriteSports: profile?.favorite_sports || [],
    gameSearchesUsed, gameSearchesLeft, fullScansUsed, fullScansLeft, consumePropRefresh,
    signUp, signIn, signOut, updateSettings, addLedgerEntry, updateLedgerEntry, refreshProfile,
  };
}

/* Signature element: a live ribbon of the best current prices on the board. */
function LineTicker({ games }){
  const ticks = useMemo(() => {
    const out = [];
    for(const g of games){
      const best = {};
      const hm = headlineMarket(g.sport_key);
      for(const bk of g.bookmakers){
        const mkt = bk.markets.find(m => m.key === hm);
        if(!mkt) continue;
        for(const oc of mkt.outcomes){
          if(!best[oc.name] || oc.price > best[oc.name].price){
            best[oc.name] = { price: oc.price, book: bk.title };
          }
        }
      }
      for(const [team, v] of Object.entries(best)){
        out.push({ team: shortTeam(team), price: v.price, book: v.book });
      }
    }
    return out.slice(0, 40);
  }, [games]);

  if(ticks.length === 0){
    return (
      <div className="ticker">
        <div className="shell ticker-idle">Live board · waiting for prices</div>
      </div>
    );
  }

  // Rendered twice so the -50% keyframe loops seamlessly.
  const run = [...ticks, ...ticks];

  return (
    <div className="ticker">
      <div className="ticker-track" aria-hidden="true">
        {run.map((t,i) => (
          <span className="tick" key={i}>
            <span className="tick-team">{t.team}</span>
            <span className={`tick-price ${t.price > 0 ? "up" : ""}`}>{fmtAmerican(t.price)}</span>
            <span className="tick-book">{t.book}</span>
          </span>
        ))}
      </div>
      <p className="vh">Best current moneyline prices across the books on your board.</p>
    </div>
  );
}

function AuthDialog({ account, open, onClose }){
  const ref = useRef(null);
  const [mode, setMode] = useState("signin"); // signin | signup | sent | reset | reset-sent
  const [email, setEmail] = useState("");
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [confirm, setConfirm] = useState("");
  const [tos, setTos] = useState(false);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    const d = ref.current;
    if(!d) return;
    if(open && !d.open) d.showModal();
    if(!open && d.open) d.close();
  }, [open]);

  const reset = () => { setEmail(""); setUsername(""); setPassword(""); setConfirm(""); setTos(false); setErr(""); };

  const sendReset = async () => {
    if(!email.trim()){ setErr("Enter the email on your account."); return; }
    setErr(""); setBusy(true);
    const { error } = await sb.auth.resetPasswordForEmail(email.trim(), {
      redirectTo: window.location.origin,
    });
    setBusy(false);
    if(error){ setErr(error.message); return; }
    setMode("reset-sent");
  };

  const submit = async () => {
    setErr(""); setBusy(true);
    if(mode === "signup"){
      const r = await account.signUp(email, username, password, confirm, tos);
      setBusy(false);
      if(typeof r === "string"){ setErr(r); return; }
      setMode("sent");
      return;
    }
    if(!email.trim() || !password.trim()){ setBusy(false); setErr("Enter your email and password."); return; }
    const e = await account.signIn(email, password);
    setBusy(false);
    if(e){ setErr(e); return; }
    reset(); setMode("signin"); onClose();
  };

  return (
    <dialog ref={ref} onClose={onClose} onCancel={onClose}>
      <div className="sheet">
        {mode === "sent" ? (
          <React.Fragment>
            <h2>Confirm your email</h2>
            <p className="sub">
              We sent a link to <b>{email}</b>. Open it to activate the account, then sign in.
            </p>
            <div className="sheet-actions">
              <button className="btn btn-solid" onClick={() => { setMode("signin"); reset(); }}>
                Back to sign in

            </div>
          </React.Fragment>
        ) : mode === "reset-sent" ? (
          <React.Fragment>
            <h2>Check your email</h2>
            <p className="sub">
              If an account exists for <b>{email}</b>, a reset link is on its way. Open it to set
              a new password.
            </p>
            <div className="sheet-actions">
              <button className="btn btn-solid" onClick={() => { setMode("signin"); reset(); }}>
                Back to sign in
              </button>
            </div>
          </React.Fragment>
        ) : mode === "reset" ? (
          <React.Fragment>
            <h2>Reset your password</h2>
            <p className="sub">Enter your email and we'll send a link to set a new one.</p>
            {err && <div className="msg msg-err">{err}</div>}
            <div className="field">
              <label htmlFor="au-reset">Email</label>
              <input id="au-reset" type="email" autoComplete="email"
                value={email} onChange={e => setEmail(e.target.value)}
                onKeyDown={e => { if(e.key === "Enter") sendReset(); }} />
            </div>
            <div className="sheet-actions">
              <button className="btn btn-solid" onClick={sendReset} disabled={busy}>
                {busy ? "Sending…" : "Send reset link"}
              </button>
              <button className="linkish" style={{alignSelf:"center"}}
                onClick={() => { setMode("signin"); setErr(""); }}>
                Back to sign in
              </button>
            </div>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <h2>{mode === "signup" ? "Create your account" : "Sign in"}</h2>
            <p className="sub">
              {mode === "signup"
                ? "Your picks and performance stay private to you."
                : "Pick up where you left off."}
            </p>

            {err && <div className="msg msg-err">{err}</div>}

            <div className="field">
              <label htmlFor="au-email">Email</label>
              <input id="au-email" type="email" autoComplete="email"
                value={email} onChange={e => setEmail(e.target.value)} />
            </div>

            {mode === "signup" && (
              <div className="field">
                <label htmlFor="au-user">Username</label>
                <input id="au-user" type="text" autoComplete="username" placeholder="3–20 characters"
                  value={username} onChange={e => setUsername(e.target.value)} />
              </div>
            )}

            <div className="field">
              <label htmlFor="au-pass">Password</label>
              <input id="au-pass" type="password"
                autoComplete={mode === "signup" ? "new-password" : "current-password"}
                value={password} onChange={e => setPassword(e.target.value)} />
            </div>

            {mode === "signup" && (
              <React.Fragment>
                <div className="field">
                  <label htmlFor="au-conf">Confirm password</label>
                  <input id="au-conf" type="password" autoComplete="new-password"
                    value={confirm} onChange={e => setConfirm(e.target.value)} />
                </div>

            )}

            <div className="sheet-actions">
              <button className={`btn ${mode === "signup" ? "btn-flare" : "btn-solid"}`}
                onClick={submit} disabled={busy}>
                {busy ? "Working…" : mode === "signup" ? "Create account" : "Sign in"}
              </button>
              <button className="linkish" style={{alignSelf:"center"}}
                onClick={() => { setMode(mode === "signup" ? "signin" : "signup"); setErr(""); }}>
                {mode === "signup" ? "Already have an account? Sign in" : "New here? Create an account"}
              </button>
              {mode === "signin" && (
                <button className="linkish" style={{alignSelf:"center"}}
                  onClick={() => { setMode("reset"); setErr(""); }}>
                  Forgot your password?
                </button>
              )}
            </div>
          </React.Fragment>
        )}
      </div>
    </dialog>
  );
}
