function App(){
  const [tab, setTab] = useState("board");
  const [timing, setTiming] = useState("pre");
  const [sports, setSports] = useState([]);
  const [allSports, setAllSports] = useState([]);
  const [sportKey, setSportKey] = useState("");
  const [games, setGames] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [quota, setQuota] = useState(null);
  const [feedMeta, setFeedMeta] = useState(null);
  const [parlay, setParlay] = useState([]);
  const [stake, setStake] = useState(20);
  const [bookBoosts, setBookBoosts] = useState({});
  const [logMsg, setLogMsg] = useState("");
  const [authOpen, setAuthOpen] = useState(false);
  const [gameQuery, setGameQuery] = useState("");
  const [trayOpen, setTrayOpen] = useState(true);

  /* V1.1 — prop odds live in per-event payloads that the board's `games` array
     never contains. Before this, pricing a prop parlay across two books failed:
     each book could only price the leg picked FROM it, because the other book's
     prop price had already been thrown away after rendering. We keep those
     payloads now, so every book in the slip can be priced against every leg. */
  const [propCache, setPropCache] = useState({});
  const cacheProps = useCallback((gameId, payload) => {
    if(!gameId || !payload) return;
    setPropCache(prev => {
      const byBook = new Map((prev[gameId]?.bookmakers || []).map(b => [b.key, b]));
      for(const bk of (payload.bookmakers || [])){
        const cur = byBook.get(bk.key);
        if(!cur){ byBook.set(bk.key, { ...bk, markets: [...(bk.markets || [])] }); continue; }
        const byMarket = new Map((cur.markets || []).map(m => [m.key, m]));
        for(const m of (bk.markets || [])) byMarket.set(m.key, m);
        byBook.set(bk.key, { ...cur, markets: [...byMarket.values()] });
      }
      return { ...prev, [gameId]: { bookmakers: [...byBook.values()] } };
    });
  }, []);

  const account = useAccount();
  const homeState = account.homeState;

  // View Transitions on tab change where supported; plain state change otherwise.
  const goTab = (t) => {
    if(t === tab) return;
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(document.startViewTransition && !reduce){
      document.startViewTransition(() => ReactDOM.flushSync(() => setTab(t)));
    }else{
      setTab(t);
    }
  };

  const loadSports = useCallback(async () => {
    setError("");
    try{
      const res = await fetch(`${ODDS_BASE}/v4/sports/`);
      if(!res.ok) throw new Error(`Couldn't load the sports list (${res.status}).`);
      const data = await res.json();
      setAllSports(data);
      const active = data.filter(s => s.active && SPORT_ALLOWLIST.some(p => s.key.startsWith(p)));
      setSports(active);
      /* Deliberately does NOT pick a sport. It used to grab active[0], which the
         API returns alphabetically — americanfootball_ncaaf. That flashed college
         football on load and burned an odds call before the effect below
         corrected it to NFL. That effect is now the only thing that chooses. */
    }catch(e){
      setError(`${e.message} Check the API key and your connection.`);
    }
  }, []);

  useEffect(() => { loadSports(); }, [loadSports]);

  // Land on the user's favorite league once sports and profile are both in.
  // Runs only until the first choice is made, so it never fights manual switching.
  const pickedInitialSport = useRef(false);
  useEffect(() => {
    if(pickedInitialSport.current || sports.length === 0) return;
    if(account.signedIn && !account.profile) return; // wait for the profile
    const fav = account.favoriteSports?.[0];
    const target = (fav && sports.some(s => s.key === fav)) ? fav
      : (sports.find(s => s.key === "americanfootball_nfl")?.key || sports[0].key);
    pickedInitialSport.current = true;
    setSportKey(target);
  }, [sports, account.signedIn, account.profile, account.favoriteSports]);

  const loadOdds = useCallback(async () => {
    if(!sportKey) return;
    setLoading(true); setError("");
    try{
      const res = await fetch(`${ODDS_BASE}/v4/sports/${sportKey}/odds/?regions=us,us2&markets=${marketsFor(sportKey)}&oddsFormat=american`);
      const meta = readFeedMeta(res);
      if(meta.remaining !== null) setQuota(String(meta.remaining));
      setFeedMeta(meta);
      if(!res.ok) throw new Error(await apiError(res));
      setGames(await res.json());
    }catch(e){
      setError(e.message); setGames([]);
    }finally{
      setLoading(false);
    }
  }, [sportKey]);

  useEffect(() => { if(sportKey) loadOdds(); }, [sportKey, loadOdds]);

  const openSettings = () => {
    const el = document.getElementById("settings-pop");
    if(el?.showPopover) el.showPopover();
  };

  const toggleFavoriteSport = async (key) => {
    if(!account.signedIn) return;
    const cur = account.favoriteSports;
    const next = cur.includes(key) ? cur.filter(k => k !== key) : [...cur, key];
    await account.updateSettings({ favorite_sports: next });
  };


  const filteredGames = useMemo(() => games.map(g => ({
    ...g,
    bookmakers: g.bookmakers.filter(bk => {
      if(BOOKMAKER_BLACKLIST.includes(bk.key)) return false;
      if(homeState === "ALL") return true;
      const states = BOOK_STATES[bk.key];
      return states ? states.includes(homeState) : false;
    }),
  })), [games, homeState]);

  const { preGames, liveGames } = useMemo(() => {
    const now = new Date();
    const pre = [], live = [];
    for(const g of filteredGames){ (new Date(g.commence_time) > now ? pre : live).push(g); }
    return { preGames: pre, liveGames: live };
  }, [filteredGames]);

  const timedGames = timing === "pre" ? preGames : liveGames;
  const visibleGames = useMemo(() => {
    const q = gameQuery.trim().toLowerCase();
    if(!q) return timedGames;
    return timedGames.filter(g =>
      `${g.away_team || ""} ${g.home_team || ""} ${g.sport_title || ""}`.toLowerCase().includes(q));
  }, [timedGames, gameQuery]);

  const groupedByDay = useMemo(() => {
    const groups = []; const byKey = {};
    const sorted = [...visibleGames].sort((a,b) => new Date(a.commence_time) - new Date(b.commence_time));
    for(const g of sorted){
      const d = new Date(g.commence_time);
      const key = d.toDateString();
      if(!byKey[key]){
        const today = new Date().toDateString();
        const tomorrow = new Date(Date.now() + 86400000).toDateString();
        const label = key === today ? "Today" : key === tomorrow ? "Tomorrow"
          : d.toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric" });
        byKey[key] = { label, games: [] };
        groups.push(byKey[key]);
      }
      byKey[key].games.push(g);
    }
    return groups;
  }, [visibleGames]);

  const addLeg = (game, bk, mkt, outcome) => {
    const oKey = outcomeKeyOf(outcome);
    const legId = `${game.id}-${mkt.key}-${oKey}`;
    const legData = {
      id: legId, gameId: game.id, sportKey: game.sport_key,
      matchup: `${game.away_team} @ ${game.home_team}`,
      market: mkt.key, outcomeKey: oKey,
      label: outcomeLabel(mkt.key, outcome),
      pickedBookKey: bk.key, pickedBookTitle: bk.title,
      livePrice: outcome.price,
    };
    setTrayOpen(true);
    setParlay(prev => {
      const idx = prev.findIndex(l => l.id === legId);
      if(idx === -1) return [...prev, legData];
      if(prev[idx].pickedBookKey === bk.key) return prev.filter(l => l.id !== legId);
      const copy = [...prev]; copy[idx] = legData; return copy;
    });
  };
  const removeLeg = (id) => setParlay(prev => prev.filter(l => l.id !== id));
  const parlayPickedSet = useMemo(() => new Set(parlay.map(l => `${l.pickedBookKey}|${l.id}`)), [parlay]);

  const chosenBooksComparison = useMemo(() => {
    if(parlay.length === 0) return [];
    const bookKeys = [...new Set(parlay.map(l => l.pickedBookKey))];
    return bookKeys.map(bookKey => {
      let decimal = 1, legsFound = 0; const missing = [];
      const title = parlay.find(l => l.pickedBookKey === bookKey)?.pickedBookTitle || bookKey;
      for(const leg of parlay){
        const game = filteredGames.find(g => g.id === leg.gameId);
        // board markets → cached prop payloads → the price captured on click
        let price = priceFrom(game, bookKey, leg);
        if(price === null) price = priceFrom(propCache[leg.gameId], bookKey, leg);
        if(price === null && leg.pickedBookKey === bookKey && leg.livePrice != null) price = leg.livePrice;
        if(price !== null){ decimal *= americanToDecimal(price); legsFound++; }
        else missing.push(leg.label);
      }
      return { bookKey, title, decimal, legsFound, missing, complete: legsFound === parlay.length };
    });
  }, [parlay, filteredGames, propCache]);

  const stakeNum = Number(stake) || 0;

  const rankedComparison = useMemo(() => {
    const withPayout = chosenBooksComparison.map(row => {
      const basePayout = stakeNum * row.decimal;
      const boostPct = Number(bookBoosts[row.bookKey]) || 0;
      const boostedPayout = boostPct > 0 ? stakeNum + (basePayout - stakeNum) * (1 + boostPct/100) : basePayout;
      return { ...row, basePayout, boostedPayout };
    });
    const complete = withPayout.filter(r => r.complete).sort((a,b) => b.boostedPayout - a.boostedPayout);
    return [...complete, ...withPayout.filter(r => !r.complete)];
  }, [chosenBooksComparison, stakeNum, bookBoosts]);

  const logBestToLedger = async () => {
    const best = rankedComparison.find(r => r.complete);
    if(!best){ setLogMsg("No book covers every leg yet."); return; }
    if(!account.signedIn){ setLogMsg("Sign in to save picks."); return; }
    const now = new Date().toISOString();
    const structuredLegs = parlay.map(leg => {
      const game = filteredGames.find(g => g.id === leg.gameId);
      const price = priceFrom(game, leg.pickedBookKey, leg)
        ?? priceFrom(propCache[leg.gameId], leg.pickedBookKey, leg)
        ?? leg.livePrice ?? null;
      return {
        matchup: leg.matchup, label: leg.label,
        pickedBookKey: leg.pickedBookKey, pickedBookTitle: leg.pickedBookTitle,
        gameId: leg.gameId, sportKey: leg.sportKey, market: leg.market, outcomeKey: leg.outcomeKey,
        originalPrice: price, peakPrice: price, peakAt: now, lowPrice: price, lowAt: now,
        closePrice: price, closeAt: now,
        result: "pending",
      };
    });
    const entry = {
      book: best.title, legs: structuredLegs, stake: stakeNum,
      americanOdds: decimalToAmerican(best.decimal),
      boostPct: Number(bookBoosts[best.bookKey]) || 0,
      payout: best.boostedPayout, status: "pending",
      bookComparison: rankedComparison.map(row => ({
        title: row.title, picked: row.bookKey === best.bookKey, complete: row.complete,
        americanOdds: row.complete ? decimalToAmerican(row.decimal) : null, missing: row.missing,
      })),
    };
    const error = await account.addLedgerEntry(entry);
    setLogMsg(error ? `Couldn't save that: ${error.message}` : "Saved to your ledger.");
    setTimeout(() => setLogMsg(""), 3000);
  };

  const resolveBet = (entryId, status) => account.updateLedgerEntry(entryId, { status });

  // Track best and worst price seen while a pick is pending.
  useEffect(() => {
    if(!account.signedIn || filteredGames.length === 0) return;
    for(const entry of account.ledger){
      if(entry.status !== "pending") continue;
      let changed = false;
      const legs = entry.legs.map(leg => {
        if(leg.sportKey !== sportKey || leg.originalPrice == null) return leg;
        const game = filteredGames.find(g => g.id === leg.gameId);
        const livePrice = priceFrom(game, leg.pickedBookKey, leg)
          ?? priceFrom(propCache[leg.gameId], leg.pickedBookKey, leg);
        if(livePrice === null || livePrice === undefined) return leg;
        const outcome = { price: livePrice };
        let next = leg;
        const cur = americanToDecimal(outcome.price);
        if(leg.peakPrice == null || cur > americanToDecimal(leg.peakPrice)){
          next = { ...next, peakPrice: outcome.price, peakAt: new Date().toISOString() }; changed = true;
        }
        if(leg.lowPrice == null || cur < americanToDecimal(leg.lowPrice)){
          next = { ...next, lowPrice: outcome.price, lowAt: new Date().toISOString() }; changed = true;
        }
        // Closing line: keep overwriting while the game hasn't started. Once it has,
        // this stops updating, so whatever was last seen pre-game is the close.
        const started = new Date(game.commence_time) <= new Date();
        if(!started && leg.closePrice !== outcome.price){
          next = { ...next, closePrice: outcome.price, closeAt: new Date().toISOString() }; changed = true;
        }
        return next;
      });
      if(changed) account.updateLedgerEntry(entry.id, { legs });
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [filteredGames]);

  const [checkingResults, setCheckingResults] = useState(false);
  const checkResults = useCallback(async () => {
    if(!account.signedIn) return;
    const pendingEntries = account.ledger.filter(e => e.status === "pending");
    if(pendingEntries.length === 0) return;
    setCheckingResults(true);
    const sportKeys = [...new Set(pendingEntries.flatMap(e => e.legs.map(l => l.sportKey)))];
    const scoresBySport = {};
    for(const sk of sportKeys){
      try{
        const res = await fetch(`${ODDS_BASE}/v4/sports/${sk}/scores/?daysFrom=3`);
        if(res.ok){
          const data = await res.json();
          scoresBySport[sk] = {};
          for(const ev of data) scoresBySport[sk][ev.id] = ev;
        }
      }catch(e){ /* leave pending */ }
    }
    for(const entry of pendingEntries){
      const legs = entry.legs.map(leg => {
        if(leg.result && leg.result !== "pending") return leg;
        return { ...leg, result: gradeLeg(leg, scoresBySport[leg.sportKey]?.[leg.gameId]) };
      });
      const results = legs.map(l => l.result);
      let status = "pending";
      if(results.every(r => r !== "pending")){
        if(results.includes("loss")) status = "lost";
        else if(results.every(r => r === "push")) status = "push";
        else status = "won";
      }
      if(status !== entry.status || legs.some((l,i) => l.result !== entry.legs[i].result)){
        await account.updateLedgerEntry(entry.id, { legs, status });
      }
    }
    setCheckingResults(false);
  }, [account]);

  useEffect(() => { if(tab === "dashboard") checkResults(); }, [tab]); // eslint-disable-line react-hooks/exhaustive-deps

  const stateName = US_STATES.find(([c]) => c === homeState)?.[1] || "all books";
  const NAV = [["board","Board"],["players","Players"],
               ["dashboard","Dashboard"],["pricing","Pricing"],["info","How it works"]];

  return (
    <React.Fragment>
      <header className="masthead">
        <div className="shell masthead-row">
          <Brandmark />
          <nav className="mast-nav" aria-label="Sections">
            {NAV.map(([k,label]) => (
              <button key={k} onClick={() => goTab(k)} aria-current={tab === k ? "page" : undefined}>
                {label}
              </button>
            ))}
          </nav>
          <div className="mast-right">
            {/* Feed usage is an operating detail and is never shown to users.
                The value is still read into `quota` if it's ever wanted. */}
            {tab === "board" && (
              <button className="ghost" onClick={loadOdds} disabled={loading}>
                {loading ? "Refreshing…" : "Refresh odds"}
              </button>
            )}
            {account.authReady && (
              account.signedIn ? (
                <div className="whoami">
                  <b>{account.username}</b>
                  <span className="tier" data-t={account.isPro ? "pro" : "free"}>
                    {account.isPro ? "Pro" : "Free"}
                  </span>
                  <button className="ghost" onClick={openSettings}>Settings</button>
                  <button className="ghost" onClick={account.signOut}>Sign out</button>
                </div>
              ) : (
                <button className="btn btn-flare" onClick={() => setAuthOpen(true)}>Sign in</button>
              )
            )}
          </div>
        </div>
        <LineTicker games={filteredGames} />
      </header>

      <main className="shell" style={{viewTransitionName:"page"}}>
        {/* Ads removed in V1.3 — a placeholder box cost polish for no revenue,
            and display CPM is meaningless at this traffic. The full AdSense
            implementation is in V1.2 if it is ever worth reviving. */}

        {tab === "board" && (
          <React.Fragment>
            <section className="pitch">
              <h2>What makes this different</h2>
              <p>
                Anywhere can show you one book's odds. Stackd lets you <b>build a parlay from picks
                across different books</b>, then prices that same slip at each one — with your own
                promo boosts factored in. The book with the loudest promo often isn't the one that
                pays most, and this is where you find out.
              </p>
            </section>

            <SportTiles sports={sports} sportKey={sportKey} onPick={setSportKey}
              favorites={account.favoriteSports} onToggleFavorite={toggleFavoriteSport}
              canFavorite={account.signedIn} />

            <div className="toolbar">
              <div className="searchbar">
                {/* Chrome on Android autofills a lone text input with the
                    signed-in email, which silently filters the board to
                    nothing and puts the user's address on screen. It ignores
                    autoComplete="off" alone, so the name must also not look
                    like a credential field. */}
                <input type="search" value={gameQuery} placeholder="Search teams or games"
                  name="game-filter" autoComplete="off" autoCorrect="off"
                  autoCapitalize="none" spellCheck="false" data-form-type="other"
                  onChange={e => setGameQuery(e.target.value)} aria-label="Search games" />
                {gameQuery && (
                  <button className="searchclear" onClick={() => setGameQuery("")}
                    aria-label="Clear game search">×</button>
                )}
              </div>
              <div className="seg" role="group" aria-label="Game timing">
                <button aria-pressed={timing === "pre"} onClick={() => setTiming("pre")}>
                  Pre-market ({preGames.length})
                </button>
                <button aria-pressed={timing === "live"} onClick={() => setTiming("live")}>
                  Live ({liveGames.length})
                </button>
              </div>
            </div>

            <p className="note">
              Showing the best <strong>moneyline</strong> price on each side. Open a game for every
              book, plus spreads, totals and props.
              {homeState !== "ALL" && ` Limited to books operating in ${stateName}.`}
            </p>

            <FeedNote meta={feedMeta} dev={account.isDev} />

            {timing === "live" && (
              <p className="note" style={{marginTop:-8}}>
                These games are underway, priced from the last pull. In-play lines move fast — refresh often.
              </p>
            )}

            {error && <div className="alert"><span aria-hidden="true">⚠</span><span>{error}</span></div>}
            {loading && games.length === 0 && <div className="blank">Pulling prices…</div>}
            {!loading && visibleGames.length === 0 && !error && (
              <div className="blank">
                {gameQuery
                  ? `Nothing matching "${gameQuery}" in this league right now.`
                  : homeState !== "ALL"
                  ? `No games have books available in ${stateName}. Switch to all books nationwide in Settings.`
                  : timing === "live" ? "Nothing is live right now in this league."
                  : "No upcoming games in this league right now."}
              </div>
            )}

            {groupedByDay.map(group => (
              <React.Fragment key={group.label}>
                <div className="daybar">
                  <span>{group.label}</span>
                  <i></i>
                  <em>{group.games.length} {group.games.length === 1 ? "game" : "games"}</em>
                </div>
                {group.games.map(g => (
                  <GameCard key={g.id} game={g} onAddLeg={addLeg} parlayPickedSet={parlayPickedSet}
                    isLive={timing === "live"} account={account}
                    homeState={homeState} onPropsLoaded={cacheProps} />
                ))}
              </React.Fragment>
            ))}

            {allSports.length > 0 && <Diagnostics allSports={allSports} shownSports={sports} />}
          </React.Fragment>
        )}

        {tab === "players" && (
          <PlayerSearch account={account} sports={sports} sportKey={sportKey}
            onPickSport={setSportKey} homeState={homeState}
            onAddLeg={addLeg} parlayPickedSet={parlayPickedSet}
            onSignIn={() => setAuthOpen(true)} onPropsLoaded={cacheProps} />
        )}
        {tab === "dashboard" && (
          <Dashboard account={account} onResolve={resolveBet}
            onCheckResults={checkResults} checking={checkingResults} />
        )}
        {tab === "pricing" && <PricingPage account={account} onSignIn={() => setAuthOpen(true)} />}
        {tab === "info" && <InfoPage />}
      </main>

      <SiteFooter />

      <AuthDialog account={account} open={authOpen} onClose={() => setAuthOpen(false)} />
      {account.signedIn && <SettingsPopover account={account} sports={sports} />}

      {(tab === "board" || tab === "players") && parlay.length > 0 && (
        <section className="tray" aria-label="Parlay comparison" data-collapsed={!trayOpen}>
          <div className="shell" style={{paddingBlock: trayOpen ? "17px" : "0"}}>

            {!trayOpen && (
              <div className="tray-peek">
                <div className="tray-peek-left">
                  <h3 className="display">Compare parlay</h3>
                  <span className="tray-count">{parlay.length} {parlay.length === 1 ? "leg" : "legs"}</span>
                  {(() => {
                    const best = rankedComparison.find(r => r.complete);
                    return best
                      ? <span className="best">{best.title} ${best.boostedPayout.toFixed(2)}</span>
                      : null;
                  })()}
                </div>
                <button className="tray-toggle" onClick={() => setTrayOpen(true)}
                  aria-expanded="false">▲ Show</button>
              </div>
            )}

            {trayOpen && (
            <React.Fragment>
            <div className="tray-head">
              <h3>
                Compare parlay
                <span className="tray-count">{parlay.length} {parlay.length === 1 ? "leg" : "legs"}</span>
              </h3>
              <div style={{display:"flex", alignItems:"center", gap:12}}>
                <button className="linkish" onClick={() => setParlay([])}>Clear</button>
                <button className="tray-toggle" onClick={() => setTrayOpen(false)}
                  aria-expanded="true">▼ Minimise</button>
              </div>
            </div>
            <p className="note" style={{margin:"4px 0 0"}}>
              Priced at the books you picked from — not every book on the board.
            </p>

            <div className="legs">
              {parlay.map(leg => (
                <span className="leg" key={leg.id}>
                  <span>{leg.matchup}</span>
                  <b>{leg.label}</b>
                  <em>{leg.pickedBookTitle}</em>
                  <button onClick={() => removeLeg(leg.id)} aria-label={`Remove ${leg.label}`}>×</button>
                </span>
              ))}
            </div>

            <div className="field" style={{maxWidth:130}}>
              <label htmlFor="stake">Stake</label>
              <input id="stake" type="number" inputMode="decimal" value={stake}
                onChange={e => setStake(e.target.value)} />
            </div>

            {rankedComparison.map((row,i) => (
              <div className="quote" key={row.bookKey}
                data-winner={row.complete && i === 0} data-partial={!row.complete}>
                <div className="quote-book">
                  {row.complete && i === 0 && <span className="flag">Pays most</span>}
                  <span>{row.title}</span>
                  {row.complete && <span className="quote-odds">{decimalToAmerican(row.decimal)}</span>}
                </div>
                {row.complete ? (
                  <div className="quote-right">
                    <span className="boost">
                      <label htmlFor={`b-${row.bookKey}`}>Your boost %</label>
                      <input id={`b-${row.bookKey}`} type="number" inputMode="decimal" placeholder="0"
                        value={bookBoosts[row.bookKey] ?? ""}
                        onChange={e => setBookBoosts(p => ({ ...p, [row.bookKey]: e.target.value }))} />
                    </span>
                    <span className="payout">${row.boostedPayout.toFixed(2)}<small>returns</small></span>
                  </div>
                ) : (
                  <span style={{fontSize:12.5, color:"var(--gold)"}}>
                    No price for {row.missing.join(", ")}
                  </span>
                )}
              </div>
            ))}

            <button className="btn btn-solid" style={{marginTop:13}}
              onClick={logBestToLedger} disabled={!rankedComparison.some(r => r.complete)}>
              Save best price to ledger
            </button>
            {logMsg && <p className="fine" style={{marginTop:7}}>{logMsg}</p>}
            </React.Fragment>
            )}
          </div>
        </section>
      )}
    </React.Fragment>
  );
}

/* ---------------- sport tiles ---------------- */
function SportTiles({ sports, sportKey, onPick, favorites, onToggleFavorite, canFavorite }){
  const [showAll, setShowAll] = useState(false);

  const byKey = Object.fromEntries(sports.map(s => [s.key, s]));

  // Pinned: the five primaries (in order) plus anything the user starred.
  const pinnedKeys = [
    ...PRIMARY_SPORTS.filter(k => byKey[k]),
    ...favorites.filter(k => byKey[k] && !PRIMARY_SPORTS.includes(k)),
  ];
  const restKeys = sports.map(s => s.key).filter(k => !pinnedKeys.includes(k));

  const Tile = ({ s }) => {
    const on = favorites.includes(s.key);
    return (
      <button className="tile" aria-pressed={sportKey === s.key} onClick={() => onPick(s.key)}>
        {canFavorite && (
          <span className="fav-star" role="button" tabIndex={0} data-on={on}
            aria-label={on ? `Unfavorite ${sportLabel(s)}` : `Favorite ${sportLabel(s)}`}
            onClick={e => { e.stopPropagation(); onToggleFavorite(s.key); }}
            onKeyDown={e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); e.stopPropagation(); onToggleFavorite(s.key); } }}>
            {on ? "★" : "☆"}
          </span>
        )}
        <span className="tile-name">{sportLabel(s)}</span>
        <span className="tile-sub">{s.group}</span>
      </button>
    );
  };

  return (
    <div className="sportbar">
      <div className="tiles">
        {pinnedKeys.map(k => <Tile key={k} s={byKey[k]} />)}
        {restKeys.length > 0 && (
          <button className="tile-more" onClick={() => setShowAll(v => !v)} aria-expanded={showAll}>
            {showAll ? "Fewer sports" : `All sports (${restKeys.length})`}
          </button>
        )}
      </div>
      {showAll && restKeys.length > 0 && (
        <div className="tile-drawer">
          {restKeys.map(k => <Tile key={k} s={byKey[k]} />)}
        </div>
      )}
    </div>
  );
}

/* ---------------- game card ---------------- */
function GameCard({ game, onAddLeg, parlayPickedSet, isLive, account, homeState, onPropsLoaded }){
  const kickoff = new Date(game.commence_time);
  const timeStr = kickoff.toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" });

  const bestML = useMemo(() => {
    const byTeam = {};
    const hm = headlineMarket(game.sport_key);
    for(const bk of game.bookmakers){
      const mkt = bk.markets.find(m => m.key === hm);
      if(!mkt) continue;
      for(const oc of mkt.outcomes){
        if(!byTeam[oc.name] || oc.price > byTeam[oc.name].price){
          byTeam[oc.name] = { price: oc.price, book: bk.title };
        }
      }
    }
    return byTeam;
  }, [game]);

  if(game.bookmakers.length === 0) return null;

  const allTeams = Object.entries(bestML);
  // Outright fields (golf, NASCAR) can list dozens of runners — show the shortest
  // prices and let the expanded view carry the rest.
  const outright = isOutright(game.sport_key);
  const teams = outright
    ? [...allTeams].sort((a,b) => americanToDecimal(a[1].price) - americanToDecimal(b[1].price)).slice(0,4)
    : allTeams;
  const hiddenCount = allTeams.length - teams.length;
  const topPrice = Math.max(...teams.map(([,v]) => v.price));

  return (
    <article className="game">
      <div className="game-top">
        <h3 className="matchup">
          {outright ? game.sport_title || "Field" : <React.Fragment>{game.away_team} <i>at</i> {game.home_team}</React.Fragment>}
        </h3>
        <div className="when">
          {isLive && <span className="livetag">Live</span>}
          <time dateTime={game.commence_time}>{timeStr}</time>
        </div>
      </div>

      <div className="prices">
        {teams.map(([team, v]) => {
          // On a two-sided game, "best" means the best price available on that side.
          // On an outright field it would just mean "the favorite", which isn't the
          // same thing at all — so we don't flag it.
          const flag = !outright && teams.length > 1 && v.price === topPrice;
          return (
            <div className="price" key={team} data-best={flag}>
              {flag && <span className="best-flag">Best</span>}
              <span className="price-team">{team}</span>
              <span className="price-num">{fmtAmerican(v.price)}</span>
              <span className="price-book">{v.book}</span>
            </div>
          );
        })}
      </div>
      {hiddenCount > 0 && (
        <p className="fine" style={{margin:"-6px 17px 12px"}}>
          Shortest {teams.length} of {allTeams.length} in the field — open for the rest.
        </p>
      )}

      <details>
        <summary>All books, spreads, totals &amp; props</summary>
        <div className="deep">
          {Object.entries(marketsMapFor(game.sport_key)).map(([mKey, mLabel]) => (
            <MarketTable key={mKey} game={game} marketKey={mKey} marketLabel={mLabel}
              onAddLeg={onAddLeg} parlayPickedSet={parlayPickedSet} />
          ))}
          <PropsSection game={game} account={account} homeState={homeState}
            onAddLeg={onAddLeg} parlayPickedSet={parlayPickedSet} onPropsLoaded={onPropsLoaded} />
        </div>
      </details>
    </article>
  );
}

function MarketTable({ game, marketKey, marketLabel, onAddLeg, parlayPickedSet }){
  const bestByOutcome = {};
  for(const bk of game.bookmakers){
    const mk = bk.markets.find(m => m.key === marketKey);
    if(!mk) continue;
    for(const oc of mk.outcomes){
      const k = outcomeKeyOf(oc);
      if(!bestByOutcome[k] || oc.price > bestByOutcome[k].price){
        bestByOutcome[k] = { price: oc.price, book: bk.key };
      }
    }
  }

  const order = [];
  const seen = new Set();
  for(const bk of game.bookmakers){
    const mk = bk.markets.find(m => m.key === marketKey);
    if(!mk) continue;
    for(const oc of mk.outcomes){
      const k = outcomeKeyOf(oc);
      if(!seen.has(k)){ seen.add(k); order.push({ k, oc }); }
    }
  }
  if(order.length === 0) return null;

  return (
    <div className="market">
      <div className="market-h">{marketLabel}</div>
      <div className="tablewrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Book</th>
              {order.map(({k, oc}) => <th scope="col" key={k}>{outcomeLabel(marketKey, oc)}</th>)}
            </tr>
          </thead>
          <tbody>
            {game.bookmakers.map(bk => {
              const mk = bk.markets.find(m => m.key === marketKey);
              if(!mk) return null;
              return (
                <tr key={bk.key}>
                  <td className="bookcell">{bk.title}</td>
                  {order.map(({k}) => {
                    const oc = mk.outcomes.find(o => outcomeKeyOf(o) === k);
                    if(!oc) return <td key={k}><span className="nil">—</span></td>;
                    const isBest = bestByOutcome[k] && bestByOutcome[k].book === bk.key;
                    const picked = parlayPickedSet.has(`${bk.key}|${game.id}-${marketKey}-${k}`);
                    return (
                      <td key={k}>
                        <button className="odds" data-best={isBest} data-picked={picked}
                          onClick={() => onAddLeg(game, bk, mk, oc)}
                          aria-label={`${picked ? "Remove" : "Add"} ${bk.title} ${outcomeLabel(marketKey, oc)} at ${fmtAmerican(oc.price)}`}>
                          {fmtAmerican(oc.price)}
                        </button>
                      </td>
                    );
                  })}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function PropsSection({ game, account, homeState, onAddLeg, parlayPickedSet, onPropsLoaded }){
  const [loaded, setLoaded] = useState(null);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");
  const [selected, setSelected] = useState("");

  /* V0.94 — props are NFL/NBA/NHL only. A league with no player markets defined
     gets no props section at all, rather than falling through to the game-level
     alternate markets and looking half-supported. */
  const playerMarkets = PROP_MARKETS[game.sport_key] || [];
  const markets = playerMarkets.length > 0
    ? [...playerMarkets, ...GAME_PROP_MARKETS]
    : [];
  const isPro = account.isPro;
  const outOfQuota = !isPro && account.gameSearchesLeft <= 0;

  const load = async (marketKey) => {
    if(!account.signedIn){ setErr("Sign in to load props."); return; }
    if(outOfQuota){ return; }
    setLoading(true); setErr(""); setSelected(marketKey);
    try{
      const res = await fetch(
        `${ODDS_BASE}/v4/sports/${game.sport_key}/events/${game.id}/odds/` +
        `?regions=us,us2&markets=${marketKey}&oddsFormat=american`);
      if(!res.ok) throw new Error(await apiError(res));
      const data = await res.json();
      const books = (data.bookmakers || []).filter(bk => {
        if(BOOKMAKER_BLACKLIST.includes(bk.key)) return false;
        if(homeState === "ALL") return true;
        const st = BOOK_STATES[bk.key];
        return st ? st.includes(homeState) : false;
      });
      const payload = { ...data, bookmakers: books, sport_key: game.sport_key,
                        home_team: game.home_team, away_team: game.away_team };
      setLoaded(payload);
      onPropsLoaded && onPropsLoaded(game.id, payload);
      if(!isPro) await account.consumePropRefresh("game");
    }catch(e){
      setErr(e.message); setLoaded(null);
    }finally{
      setLoading(false);
    }
  };

  if(markets.length === 0) return null;

  return (
    <div className="market">
      <div className="market-h">Player &amp; game props</div>

      {!account.signedIn ? (
        <p className="locked" style={{margin:0}}>Sign in to load props for this game.</p>
      ) : (
        <React.Fragment>
          {!isPro && (
            <p className="quota-line">
              <span className="quota-pip" aria-hidden="true">
                {Array.from({length: FREE_GAME_SEARCHES}).map((_,i) => (
                  <i key={i} data-used={i < account.gameSearchesUsed} />
                ))}
              </span>
              <span>
                {account.gameSearchesLeft > 0
                  ? `${account.gameSearchesLeft} of ${FREE_GAME_SEARCHES} game prop loads left today`
                  : "Out of game prop loads for today — resets at midnight"}
              </span>
            </p>
          )}

          <div className="chipset">
            {markets.map(([k,label]) => (
              <button className="chip" key={k} aria-pressed={selected === k}
                onClick={() => load(k)} disabled={outOfQuota}>
                {label}
              </button>
            ))}
          </div>

          {outOfQuota && (
            <p className="locked" style={{margin:0}}>
              You've used today's {FREE_GAME_SEARCHES} game prop loads. Pro removes the cap — or come back tomorrow.
            </p>
          )}

          {loading && <p className="fine" style={{margin:0}}>Loading {selected.replace(/_/g," ")}…</p>}
          {err && <p className="locked" style={{margin:0, borderStyle:"solid", color:"var(--rust)"}}>{err}</p>}
          {loaded && !loading && (
            loaded.bookmakers.length === 0
              ? <p className="fine" style={{margin:0}}>
                  No books posting this{homeState !== "ALL" ? " in your state" : ""}.
                </p>
              : <PropMarket event={loaded} marketKey={selected}
                  marketLabel={(markets.find(([k]) => k === selected) || ["",""])[1]}
                  onAddLeg={onAddLeg} parlayPickedSet={parlayPickedSet} />
          )}
        </React.Fragment>
      )}
    </div>
  );
}

/* Props are two-dimensional: books post different LINES as well as different prices,
   so "best" needs both. We compare prices at the most commonly posted line, and call
   out books sitting on a different line separately rather than pretending they're
   interchangeable. */
function PropMarket({ event, marketKey, marketLabel, onAddLeg, parlayPickedSet, playerFilter }){
  /* When the search matched a player name, narrow to that player so the table
     isn't every quarterback in the game. A team match passes no filter, since
     the point there is to see the whole slate. */
  const view = useMemo(() => {
    if(!playerFilter) return event;
    const f = playerFilter.toLowerCase();
    const keep = (oc) => (oc.description || oc.name || "").toLowerCase().includes(f);
    return {
      ...event,
      bookmakers: event.bookmakers
        .map(bk => ({ ...bk, markets: (bk.markets || [])
          .map(m => ({ ...m, outcomes: (m.outcomes || []).filter(keep) }))
          .filter(m => m.outcomes.length > 0) }))
        .filter(bk => bk.markets.length > 0),
    };
  }, [event, playerFilter]);

  const players = useMemo(() => {
    const map = new Map();
    for(const bk of view.bookmakers){
      const mk = bk.markets.find(m => m.key === marketKey);
      if(!mk) continue;
      for(const oc of mk.outcomes){
        const who = oc.description || oc.name;
        if(!map.has(who)) map.set(who, []);
        map.get(who).push({ bk, mk, oc });
      }
    }
    return map;
  }, [view, marketKey]);

  // Markets without an Over/Under shape (anytime TD, outright winners) use the plain table.
  const twoSided = useMemo(() => {
    for(const rows of players.values()){
      if(rows.some(r => r.oc.name === "Over" || r.oc.name === "Under")) return true;
      break;
    }
    return false;
  }, [players]);

  if(players.size === 0) return null;
  if(!twoSided){
    return <MarketTable game={view} marketKey={marketKey} marketLabel={marketLabel}
      onAddLeg={onAddLeg} parlayPickedSet={parlayPickedSet} />;
  }

  const bookCount = view.bookmakers.length;

  return (
    <div>
      <div className="market-h" style={{marginTop:4}}>
        {marketLabel}
        <span className="depth">
          {bookCount} book{bookCount === 1 ? "" : "s"} posting
          {bookCount <= 2 ? " · thin market" : ""}
        </span>
      </div>
      {[...players.entries()].map(([who, rows]) => (
        <PropPlayer key={who} who={who} rows={rows} event={view} marketKey={marketKey}
          onAddLeg={onAddLeg} parlayPickedSet={parlayPickedSet} />
      ))}
      <p className="fine">
        Best price is compared at the line most books are posting. A book on a different number isn't
        a like-for-like swap — a lower Over line is easier to hit, so it usually pays less.
        {bookCount <= 2 && " Only a couple of books price this market at all, so there isn't much to compare — that's the market, not a missing feed."}
      </p>
    </div>
  );
}

function PropPlayer({ who, rows, event, marketKey, onAddLeg, parlayPickedSet }){
  // Group by book, splitting the two sides.
  const byBook = new Map();
  for(const r of rows){
    if(!byBook.has(r.bk.key)) byBook.set(r.bk.key, { bk:r.bk, mk:r.mk, over:null, under:null });
    const slot = byBook.get(r.bk.key);
    if(r.oc.name === "Over") slot.over = r.oc;
    else if(r.oc.name === "Under") slot.under = r.oc;
  }
  const books = [...byBook.values()];

  const modalLine = (side) => {
    const counts = {};
    for(const b of books){
      const oc = b[side];
      if(!oc || oc.point == null) continue;
      counts[oc.point] = (counts[oc.point] || 0) + 1;
    }
    const entries = Object.entries(counts);
    if(entries.length === 0) return null;
    entries.sort((a,b) => b[1] - a[1]);
    return parseFloat(entries[0][0]);
  };
  const overLine = modalLine("over");
  const underLine = modalLine("under");

  const bestAt = (side, line) => {
    let best = null;
    for(const b of books){
      const oc = b[side];
      if(!oc || oc.point !== line) continue;
      if(!best || oc.price > best.price) best = { price: oc.price, key: b.bk.key };
    }
    return best;
  };
  const bestOver = overLine != null ? bestAt("over", overLine) : null;
  const bestUnder = underLine != null ? bestAt("under", underLine) : null;

  const Cell = ({ b, side, modal, best }) => {
    const oc = b[side];
    if(!oc) return <td><span className="nil">—</span></td>;
    const altLine = oc.point != null && modal != null && oc.point !== modal;
    const isBest = best && best.key === b.bk.key && !altLine;
    const k = outcomeKeyOf(oc);
    const picked = parlayPickedSet.has(`${b.bk.key}|${event.id}-${marketKey}-${k}`);
    return (
      <td>
        <button className="odds" data-best={isBest} data-picked={picked}
          onClick={() => onAddLeg(event, b.bk, b.mk, oc)}
          aria-label={`${picked ? "Remove" : "Add"} ${b.bk.title} ${who} ${side} ${oc.point} at ${fmtAmerican(oc.price)}`}>
          <span style={{opacity:.72, marginRight:5}}>{oc.point}</span>{fmtAmerican(oc.price)}
        </button>
        {altLine && <span className="fine" style={{display:"block", marginTop:1}}>alt line</span>}
      </td>
    );
  };

  return (
    <div style={{marginBottom:16}}>
      <div style={{fontSize:13.5, fontWeight:700, marginBottom:5}}>
        {who}
        {overLine != null && (
          <span style={{fontFamily:"var(--data)", fontSize:11.5, color:"var(--slate)", fontWeight:400, marginLeft:8}}>
            most books at {overLine}
          </span>
        )}
      </div>
      <div className="tablewrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Book</th>
              <th scope="col">Over</th>
              <th scope="col">Under</th>
            </tr>
          </thead>
          <tbody>
            {books.map(b => (
              <tr key={b.bk.key}>
                <td className="bookcell">{b.bk.title}</td>
                <Cell b={b} side="over" modal={overLine} best={bestOver} />
                <Cell b={b} side="under" modal={underLine} best={bestUnder} />
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* Shows the raw sport list the API returned vs. what we chose to display.
   The fastest way to answer "why isn't <league> showing up?" — if a key isn't
   in the left column, the feed isn't carrying it on this plan. */
function Diagnostics({ allSports, shownSports }){
  const shownKeys = new Set(shownSports.map(s => s.key));
  const hidden = allSports.filter(s => !shownKeys.has(s.key));
  return (
    <details className="game" style={{marginTop:26, padding:"0 17px"}}>
      <summary style={{padding:"12px 0", cursor:"pointer", fontSize:12, fontWeight:600, color:"var(--slate)"}}>
        Diagnostics — what the odds feed is actually returning
      </summary>
      <div style={{paddingBottom:18}}>
        <p className="fine" style={{marginTop:0}}>
          {allSports.length} sports returned by your API key. {shownSports.length} shown here
          (active, and on our US allowlist). If a league you expect is missing from both columns,
          the feed doesn't carry it on your current plan — that's a data source limit, not a bug
          in this app.
        </p>
        <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(230px,1fr))", gap:14}}>
          <div>
            <div className="market-h">Shown ({shownSports.length})</div>
            {shownSports.map(s => (
              <div className="cmp" key={s.key}>
                <b>{sportLabel(s)}</b>
                <span className="implied">{s.key}</span>
              </div>
            ))}
          </div>
          <div>
            <div className="market-h">Returned but filtered out ({hidden.length})</div>
            {hidden.length === 0 && <p className="fine">Nothing filtered.</p>}
            {hidden.slice(0,40).map(s => (
              <div className="cmp" key={s.key}>
                <span style={{color:"var(--slate)"}}>{s.title}</span>
                <span className="implied">{s.key}{s.active ? "" : " · off-season"}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </details>
  );
}

/* ---------------- player prop search ----------------
   V0.92 rewrite. The old version failed silently for three reasons:
     1. It had no sport selector — it inherited whichever league the Board tab
        happened to be on. Searching "Josh Allen" while MLB was selected scanned
        MLB games for an NFL quarterback and found nothing, with no explanation.
     2. `if(!res.ok) continue;` swallowed every API error, so a rejected request
        looked identical to "that player has no props."
     3. It scanned only the first 6 games and first 4 markets, silently.
   All three are now visible and under the user's control. */
function PlayerSearch({ account, sports, sportKey, onPickSport, homeState,
                        onAddLeg, parlayPickedSet, onSignIn, onPropsLoaded }){
  const [query, setQuery] = useState("");
  const [scanning, setScanning] = useState(null); // null | "query" | "all"
  const [results, setResults] = useState(null);
  const [err, setErr] = useState("");
  const [diag, setDiag] = useState([]);
  const [scanMeta, setScanMeta] = useState(null);
  const [gameLimit, setGameLimit] = useState(5);
  const [picked, setPicked] = useState([]);
  const [events, setEvents] = useState([]);
  const [eventsLoading, setEventsLoading] = useState(true);
  const [eventsErr, setEventsErr] = useState("");
  const [reloadTick, setReloadTick] = useState(0);

  const propMarkets = PROP_MARKETS[sportKey] || [];
  // Only leagues that actually carry player props — picking golf here would
  // just produce a confusing empty result.
  const propSports = sports.filter(s => (PROP_MARKETS[s.key] || []).length > 0);
  const currentSport = sports.find(s => s.key === sportKey);
  const leagueName = currentSport ? sportLabel(currentSport) : "this league";

  /* A <select> whose value matches no <option> displays the FIRST option while
     keeping its real value. So if the board sits on a league with no props
     (NCAAF, MLB), this dropdown would show "NFL" while sportKey was still
     NCAAF — and we'd fetch the wrong league's schedule behind a label that
     said otherwise. Snap to a supported league so what's shown is what's used. */
  useEffect(() => {
    if(propSports.length === 0) return;
    if(!propSports.some(s => s.key === sportKey)) onPickSport(propSports[0].key);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [propSports, sportKey]);

  // Default to the first three markets whenever the league changes.
  useEffect(() => {
    setPicked((PROP_MARKETS[sportKey] || []).slice(0,3).map(([k]) => k));
    setResults(null); setDiag([]); setErr("");
  }, [sportKey]);

  const isPro = account.isPro;
  const searchesLeft = account.gameSearchesLeft;
  const scansLeft = account.fullScansLeft;
  const outOfSearches = !isPro && searchesLeft <= 0;
  const outOfScans = !isPro && scansLeft <= 0;

  /* V0.96 — this tab fetches its own event list instead of borrowing the
     board's. Borrowing caused two bugs: scanning one league's event ids against
     another league's endpoint (404 on every request, V0.94), and then a
     permanent "loading…" when the board never caught up (V0.95). The /events
     endpoint costs no API quota, so owning the list here is free and the two
     tabs can't fall out of step. */
  useEffect(() => {
    if(!sportKey) return;
    let cancelled = false;
    (async () => {
      setEventsLoading(true); setEventsErr(""); setEvents([]);
      try{
        const res = await fetch(
          `${ODDS_BASE}/v4/sports/${sportKey}/events/`);
        if(!res.ok) throw new Error(await apiError(res));
        const data = await res.json();
        if(cancelled) return;
        const now = Date.now();
        setEvents((data || [])
          .filter(e => e.sport_key === sportKey && new Date(e.commence_time).getTime() > now)
          .sort((a,b) => new Date(a.commence_time) - new Date(b.commence_time)));
      }catch(e){
        if(!cancelled) setEventsErr(e.message);
      }finally{
        if(!cancelled) setEventsLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, [sportKey, reloadTick]);

  const candidates = events.slice(0, gameLimit);

  const labelFor = (k) =>
    (propMarkets.find(([mk]) => mk === k) || [k, k.replace(/_/g," ")])[1];

  const toggleMarket = (k) =>
    setPicked(p => p.includes(k) ? p.filter(x => x !== k) : [...p, k]);

  /* mode "query" filters to a player or team; mode "all" just pulls everything
     posted for the scanned games, so you can browse without knowing a name. */
  const runScan = async (mode) => {
    const q = mode === "all" ? "" : query.trim().toLowerCase();
    if(mode !== "all" && q.length < 3){
      setErr("Type at least three letters of a player or team name — or use Scan upcoming to browse everything.");
      return;
    }
    if(!account.signedIn){ onSignIn(); return; }
    if(mode === "all" && outOfScans) return;
    if(mode !== "all" && outOfSearches) return;
    if(picked.length === 0){ setErr("Pick at least one prop market to search."); return; }
    if(eventsLoading){
      setErr(`Still loading the ${leagueName} schedule — give it a second.`);
      return;
    }
    if(candidates.length === 0){
      setErr(eventsErr || `No upcoming ${leagueName} games on the schedule right now.`);
      return;
    }

    setScanning(mode); setErr(""); setResults(null); setDiag([]);
    setScanMeta(null);
    const rows = [], log = [];
    const marketParam = picked.join(",");
    let okCount = 0;
    /* A scan is many single-event calls, so the useful summary isn't one
       cache state but how many of them had to be paid for. */
    let nCached = 0, nFresh = 0, nSpent = 0, sawSpend = false;

    try{
      for(const g of candidates){
        const matchup = `${g.away_team} @ ${g.home_team}`;
        let res;
        try{
          res = await fetch(
            `${ODDS_BASE}/v4/sports/${sportKey}/events/${g.id}/odds/` +
            `?regions=us,us2&markets=${marketParam}&oddsFormat=american`);
        }catch(netErr){
          log.push({ matchup, ok:false, note:`couldn't reach the API — ${netErr.message}` });
          continue;
        }

        const wasCached = res.headers.get("x-stackd-cache") === "HIT";
        const spentHere = noteCredits(res, wasCached);
        if(wasCached) nCached++; else nFresh++;
        if(spentHere !== null){ nSpent += spentHere; sawSpend = true; }

        if(!res.ok){
          // Surface what the API actually said instead of hiding it.
          log.push({ matchup, ok:false, note: await apiError(res) });
          continue;
        }

        okCount++;
        const data = await res.json();
        const books = (data.bookmakers || []).filter(bk => {
          if(BOOKMAKER_BLACKLIST.includes(bk.key)) return false;
          if(homeState === "ALL") return true;
          const st = BOOK_STATES[bk.key];
          return st ? st.includes(homeState) : false;
        });

        if(books.length === 0){
          log.push({ matchup, ok:true, note: homeState === "ALL"
            ? "no books posting these markets" : "no books available in your state" });
          continue;
        }

        // A query can match the game itself (a team name) or a player in it.
        // In "all" mode everything posted counts.
        const wholeGame = mode === "all" || matchup.toLowerCase().includes(q);
        const hits = new Set();
        for(const bk of books){
          for(const m of (bk.markets || [])){
            if(wholeGame){ hits.add(m.key); continue; }
            for(const o of (m.outcomes || [])){
              if((o.description || "").toLowerCase().includes(q)) hits.add(m.key);
            }
          }
        }

        log.push({ matchup, ok:true, note:
          hits.size === 0 ? `${books.length} books posting, no match in them`
          : mode === "all" ? `${hits.size} market${hits.size === 1 ? "" : "s"} posted`
          : wholeGame ? `team matched — showing all ${hits.size} market${hits.size === 1 ? "" : "s"}`
          : `found in ${hits.size} market${hits.size === 1 ? "" : "s"}` });

        const payload = { ...data, bookmakers: books, sport_key: sportKey,
                          home_team: g.home_team, away_team: g.away_team };
        if(hits.size > 0) onPropsLoaded && onPropsLoaded(g.id, payload);

        for(const mk of hits){
          rows.push({
            marketKey: mk, label: labelFor(mk), matchup,
            // whole-game results show every player; a name match narrows to one
            playerFilter: wholeGame ? null : q,
            event: payload,
          });
        }
      }

      if(!isPro) await account.consumePropRefresh(mode === "all" ? "scan" : "game");
      setDiag(log);
      setResults({ q, rows });
      setScanMeta({
        games: nCached + nFresh,
        cached: nCached,
        fresh: nFresh,
        spent: sawSpend ? nSpent : null,
        remaining: creditTracker.remaining,
        at: Date.now(),
      });

      if(rows.length === 0){
        if(okCount === 0){
          setErr("Live prices couldn't be loaded for any of these games just now — this is on our end, not your search. Try again shortly.");
        }else if(mode === "all"){
          setErr(`No books are posting these markets yet for the ${candidates.length} ${leagueName} game${candidates.length === 1 ? "" : "s"} scanned. Props usually go up closer to game time — try again nearer kickoff, or add more markets.`);
        }else{
          setErr(`Nothing matching "${query.trim()}" in the ${candidates.length} ${leagueName} game${candidates.length === 1 ? "" : "s"} scanned — that covers both player and team names. Check the spelling, scan more games, or add more markets.`);
        }
      }
    }catch(e){
      setErr(e.message);
    }finally{
      setScanning(null);
    }
  };

  return (
    <React.Fragment>
      <div className="page-head">
        <p className="eyebrow">Player props</p>
        <h1 className="page-title">Find a player or game.<br/>Find the best number.</h1>
        <p className="page-lede">
          Search a player to see every book's line and price side by side, or a team to pull up the
          whole game. No one in mind? Hit <strong>Scan upcoming</strong> to browse everything posted.
          A better price and a better line aren't the same thing — this shows both.
        </p>
      </div>

      <div className="toolbar">
        <select className="select-native" value={sportKey}
          onChange={e => onPickSport(e.target.value)} aria-label="League to search">
          {propSports.map(s => <option key={s.key} value={s.key}>{sportLabel(s)}</option>)}
        </select>
        <div className="searchbar">
          {/* Same autofill guard as the board search — see the note there. */}
          <input type="search" value={query} placeholder="Player or team — e.g. Josh Allen, or Chiefs"
            name="player-filter" autoComplete="off" autoCorrect="off"
            autoCapitalize="none" spellCheck="false" data-form-type="other"
            onChange={e => setQuery(e.target.value)}
            onKeyDown={e => { if(e.key === "Enter") runScan("query"); }}
            aria-label="Search for a player or game" />
          {query && <button className="searchclear"
            onClick={() => { setQuery(""); setResults(null); setErr(""); setDiag([]); }}
            aria-label="Clear search">×</button>}
        </div>
        <button className="btn btn-solid" onClick={() => runScan("query")}
          disabled={scanning || outOfSearches}>
          {scanning === "query" ? "Searching…" : "Search"}
        </button>
        <button className="btn" onClick={() => runScan("all")}
          disabled={scanning || outOfScans}
          title="Pull every posted prop for the games below — no search term needed">
          {scanning === "all" ? "Scanning…" : "Scan upcoming"}
        </button>
      </div>

      {propSports.length === 0 ? (
        <div className="blank">No leagues with player props are in season right now.</div>
      ) : (
        <React.Fragment>
          <div className="scan-setup">
            <div className="market-h">Markets to search</div>
            <div className="chipset">
              {propMarkets.map(([k,label]) => (
                <button className="chip" key={k} aria-pressed={picked.includes(k)}
                  onClick={() => toggleMarket(k)}>{label}</button>
              ))}
            </div>

            <div className="scan-row">
              <label htmlFor="ps-games">Scan</label>
              <select id="ps-games" className="select-native" value={gameLimit}
                onChange={e => setGameLimit(Number(e.target.value))}>
                <option value={3}>3 games</option>
                <option value={5}>5 games</option>
                <option value={10}>10 games</option>
                <option value={25}>every loaded game</option>
              </select>
              <span className="scan-note">
                {eventsLoading ? `loading the ${leagueName} schedule…`
                  : eventsErr ? eventsErr
                  : events.length === 0 ? `no upcoming ${leagueName} games scheduled`
                  : `${candidates.length} of ${events.length} upcoming ${leagueName} games`}
              </span>
              {!eventsLoading && (eventsErr || events.length === 0) && (
                <button className="linkish" onClick={() => setReloadTick(n => n + 1)}>
                  Retry
                </button>
              )}
            </div>
          </div>

          {!isPro && account.signedIn && (
            <p className="quota-note">
              Free plan today: <strong>{searchesLeft} of {FREE_GAME_SEARCHES}</strong> game searches
              and <strong>{scansLeft} of {FREE_FULL_SCANS}</strong> full scan{FREE_FULL_SCANS === 1 ? "" : "s"} left.
              Both reset at midnight. Pro lifts the cap.
            </p>
          )}

          {outOfSearches && outOfScans && (
            <div className="blank">
              You've used today's searches and your full scan. Pro removes the cap, or they reset at midnight.
            </div>
          )}

          {err && <div className="alert"><span aria-hidden="true">⚠</span><span>{err}</span></div>}
          {scanning && <div className="blank">Checking {candidates.length} {leagueName} game{candidates.length === 1 ? "" : "s"} for prop markets…</div>}
          {!scanning && <ScanNote meta={scanMeta} dev={account.isDev} />}

          {results?.rows.map((r,i) => (
            <div className="game" key={i} style={{padding:"15px 17px"}}>
              <div className="row-meta" style={{marginBottom:8}}>{r.matchup}</div>
              <PropMarket event={r.event} marketKey={r.marketKey} marketLabel={r.label}
                playerFilter={r.playerFilter}
                onAddLeg={onAddLeg} parlayPickedSet={parlayPickedSet} />
            </div>
          ))}

          {/* The per-game scan breakdown was operator diagnostics dressed as a
              feature — it explained our request mechanics rather than telling
              anyone something they could act on. Developer accounts keep it
              for working out why a scan came back thin. */}
          {diag.length > 0 && account.isDev && (
            <details className="game" style={{padding:"0 17px", marginTop:14}}>
              <summary style={{padding:"12px 0", cursor:"pointer", fontSize:12,
                               fontWeight:600, color:"var(--slate)"}}>
                Scan detail — what each game returned
              </summary>
              <div style={{paddingBottom:16}}>
                {diag.map((d,i) => (
                  <div className="cmp" key={i}>
                    <span style={{color: d.ok ? "var(--ink)" : "var(--rust)"}}>{d.matchup}</span>
                    <span className="implied">{d.note}</span>
                  </div>
                ))}
                <p className="fine">
                  Markets requested: {picked.map(labelFor).join(", ") || "none"}.
                </p>
              </div>
            </details>
          )}
        </React.Fragment>
      )}

      <div className="prose-card" style={{marginTop:18}}>
        <h3>On performance stats</h3>
        <p className="small">
          Stackd doesn't carry player statistics — season averages, recent form, matchup splits.
          The odds feed powering this app is a pricing feed, not a stats feed, so any numbers we
          showed here would be invented rather than sourced, and inventing stats you'd bet on is
          the last thing this tool should do. Adding real ones means wiring in a dedicated stats
          provider, which is a good next build once the caching backend is in.
        </p>
        <p className="small">
          What the prices above <em>do</em> tell you is the market's own estimate: an Over at
          −110 implies roughly a 52% chance. That's the books' collective read on the same
          question a stat line would help you answer.
        </p>
      </div>
    </React.Fragment>
  );
}

/* ---------------- dashboard ---------------- */
function legState(result){
  const map = {
    win:  { c:"var(--mint)", t:"Won" },
    loss: { c:"var(--rust)", t:"Lost" },
    push: { c:"var(--gold)", t:"Push" },
    pending: { c:"var(--slate-lo)", t:"Open" },
  };
  const r = map[result] || map.pending;
  return <span style={{fontSize:10, fontWeight:800, letterSpacing:".1em", textTransform:"uppercase", color:r.c}}>{r.t}</span>;
}

function Dashboard({ account, onResolve, onCheckResults, checking }){
  const [period, setPeriod] = useState("week");

  // Average CLV across every leg that has both a locked and a closing price.
  // Must sit above the early return — hooks have to run in the same order every render.
  const avgCLV = useMemo(() => {
    const vals = [];
    for(const e of account.ledger){
      for(const l of (e.legs || [])){
        const v = clvPercent(l.originalPrice, l.closePrice);
        if(v != null && isFinite(v)) vals.push(v);
      }
    }
    return vals.length ? vals.reduce((a,b) => a+b, 0) / vals.length : null;
  }, [account.ledger]);

  if(!account.signedIn){
    return (
      <React.Fragment>
        <div className="page-head">
          <p className="eyebrow">Your record</p>
          <h1 className="page-title">Track what<br/>you actually did</h1>
          <p className="page-lede">
            Sign in to keep a private record of every pick — the price you locked, the best and worst
            it hit afterward, and your running P/L.
          </p>
        </div>
        <div className="blank">Sign in from the top of the page to start tracking.</div>
      </React.Fragment>
    );
  }

  const pending = account.ledger.filter(e => e.status === "pending");
  const settled = account.ledger.filter(e => e.status !== "pending");
  const netAll = settled.reduce((s,e) => s + betPL(e), 0);
  const wins = settled.filter(e => e.status === "won").length;
  const losses = settled.filter(e => e.status === "lost").length;

  const ap = PERIODS.find(p => p.key === period);
  const inPeriod = ap.days === null ? settled
    : settled.filter(e => (Date.now() - new Date(e.timestamp).getTime()) <= ap.days * 86400000);
  const pNet = inPeriod.reduce((s,e) => s + betPL(e), 0);
  const pW = inPeriod.filter(e => e.status === "won").length;
  const pL = inPeriod.filter(e => e.status === "lost").length;

  return (
    <React.Fragment>
      <div className="page-head">
        <p className="eyebrow">Your record</p>
        <h1 className="page-title">Performance</h1>
        <p className="page-lede">
          Every pick you've saved, graded from final scores where we can get them, with the odds
          movement you either caught or missed.
        </p>
      </div>

      <div className="rowbar">
        <h2 className="section-h" style={{margin:0}}>All time</h2>
        <button className="btn" onClick={onCheckResults} disabled={checking || pending.length === 0}>
          {checking ? "Checking scores…" : "Check results"}
        </button>
      </div>

      <dl className="stats">
        <div className="stat">
          <dt>Net</dt>
          <dd className={netAll >= 0 ? "pos" : "neg"}>{netAll >= 0 ? "+" : "−"}{Math.abs(netAll).toFixed(2)}</dd>
        </div>
        <div className="stat">
          <dt>Record</dt>
          <dd>{wins}–{losses}</dd>
        </div>
        <div className="stat">
          <dt>Open picks</dt>
          <dd>{pending.length}</dd>
        </div>
        <div className="stat">
          <dt>Avg closing line value</dt>
          {account.isPro ? (
            <dd className={avgCLV == null ? "" : avgCLV >= 0 ? "pos" : "neg"}>
              {avgCLV == null ? "—" : `${avgCLV >= 0 ? "+" : "−"}${Math.abs(avgCLV).toFixed(1)}%`}
            </dd>
          ) : (
            <dd style={{fontSize:14, color:"var(--slate-lo)", letterSpacing:0, lineHeight:1.4}}>
              Pro
            </dd>
          )}
        </div>
      </dl>
      {account.isPro && avgCLV != null && (
        <p className="note" style={{marginTop:-14}}>
          {avgCLV >= 0
            ? "You're beating the closing line on average — the sign that picks are landing ahead of the market, not behind it."
            : "You're closing behind the market on average. Getting in earlier, or shopping harder before you lock, is usually where this turns around."}
        </p>
      )}

      <div className="rowbar">
        <div className="seg" role="group" aria-label="Time period">
          {PERIODS.map(p => (
            <button key={p.key} aria-pressed={period === p.key} onClick={() => setPeriod(p.key)}>
              {p.label}
            </button>
          ))}
        </div>
        <button className="btn"
          onClick={() => exportLedgerCSV(account.ledger, account.username)}
          disabled={account.ledger.length === 0}
          title="Download your full ledger">
          Export CSV
        </button>
      </div>

      <dl className="stats">
        <div className="stat">
          <dt>{ap.label} net</dt>
          <dd className={pNet >= 0 ? "pos" : "neg"}>{pNet >= 0 ? "+" : "−"}{Math.abs(pNet).toFixed(2)}</dd>
        </div>
        <div className="stat">
          <dt>{ap.label} record</dt>
          <dd>{pW}–{pL}</dd>
        </div>
      </dl>

      {account.ledger.length === 0 && (
        <div className="blank">
          Nothing saved yet. Build a slip on the board, then save the best price to start a record.
        </div>
      )}

      {pending.length > 0 && (
        <React.Fragment>
          <h2 className="section-h">Open</h2>
          {pending.map(e => <BetCard key={e.id} entry={e} onResolve={onResolve} isPro={account.isPro} />)}
        </React.Fragment>
      )}
      {settled.length > 0 && (
        <React.Fragment>
          <h2 className="section-h">Settled</h2>
          {settled.map(e => <BetCard key={e.id} entry={e} onResolve={onResolve} isPro={account.isPro} />)}
        </React.Fragment>
      )}
    </React.Fragment>
  );
}

function BetCard({ entry, onResolve, isPro }){
  return (
    <article className="bet">
      <div className="bet-top">
        <div>
          <span className="bet-book">{entry.book}</span>{" "}
          <span className="bet-odds">{entry.americanOdds}</span>{" "}
          {entry.boostPct > 0 && <span className="bet-boost">+{entry.boostPct}% boost</span>}
        </div>
        <span className="state" data-s={entry.status}>{entry.status === "pending" ? "Open" : entry.status}</span>
      </div>

      <div className="bet-legs">
        {entry.legs.map((l,i) => (
          <div key={i}>{l.matchup}: {l.label} <em>{l.pickedBookTitle}</em></div>
        ))}
      </div>

      <div className="bet-money">
        <span>${entry.stake.toFixed(2)} → ${entry.payout.toFixed(2)}</span>
        <BetDetail entry={entry} isPro={isPro} />
      </div>

      {entry.status === "pending" && (
        <div className="settle">
          <button className="w" onClick={() => onResolve(entry.id, "won")}>Mark won</button>
          <button onClick={() => onResolve(entry.id, "push")}>Mark push</button>
          <button className="l" onClick={() => onResolve(entry.id, "lost")}>Mark lost</button>
        </div>

    </article>
  );
}

function BetDetail({ entry, isPro }){
  const [open, setOpen] = useState(false);
  return (
    <React.Fragment>
      <button className="linkish" onClick={() => setOpen(o => !o)} aria-expanded={open}>
        {open ? "Hide breakdown" : "Show breakdown"}
      </button>
      {open && (
        <div className="detail" style={{flexBasis:"100%"}}>
          {entry.bookComparison?.length > 0 && (
            <React.Fragment>
              <div className="market-h">What each book was paying</div>
              <div style={{marginBottom:15}}>
                {entry.bookComparison.map((b,i) => (
                  <div className="cmp" key={i}>
                    <span>
                      <b>{b.title}</b>
                      {b.picked && <span className="pick">Took it</span>}
                    </span>
                    {b.complete
                      ? <span style={{fontFamily:"var(--data)", color: b.picked ? "var(--flare)" : "var(--ink)"}}>
                          {b.americanOdds}
                        </span>
                      : <span style={{fontSize:11.5, color:"var(--gold)"}}>
                          no price for {(b.missing || []).join(", ")}
                        </span>}
                  </div>
                ))}
              </div>
            </React.Fragment>
          )}

          <div className="market-h">Where each leg moved</div>
          <div className="tablewrap">
            <table>
              <thead>
                <tr>
                  <th scope="col">Leg</th><th scope="col">Result</th>
                  <th scope="col">Locked</th><th scope="col">Peak</th>
                  <th scope="col">Low</th><th scope="col">Close</th><th scope="col">CLV</th>
                </tr>
              </thead>
              <tbody>
                {entry.legs.map((l,i) => (
                  <tr key={i}>
                    <td style={{fontSize:12.5}}>{l.label}</td>
                    <td>{legState(l.result)}</td>
                    <td style={{fontFamily:"var(--data)", fontSize:12.5}}>
                      {l.originalPrice != null ? fmtAmerican(l.originalPrice) : "—"}
                    </td>
                    <td style={{fontFamily:"var(--data)", fontSize:12.5, color:"var(--mint)"}}>
                      {l.peakPrice != null ? fmtAmerican(l.peakPrice) : "—"}
                    </td>
                    <td style={{fontFamily:"var(--data)", fontSize:12.5, color:"var(--rust)"}}>
                      {l.lowPrice != null ? fmtAmerican(l.lowPrice) : "—"}
                    </td>
                    <td style={{fontFamily:"var(--data)", fontSize:12.5}}>
                      {l.closePrice != null ? fmtAmerican(l.closePrice) : "—"}
                    </td>
                    <td style={{fontFamily:"var(--data)", fontSize:12.5}}>
                      {(() => {
                        if(!isPro) return <span style={{color:"var(--slate-lo)", fontSize:11}}>Pro</span>;
                        const v = clvPercent(l.originalPrice, l.closePrice);
                        if(v == null) return "—";
                        return <span style={{color: v >= 0 ? "var(--mint)" : "var(--rust)"}}>
                          {v >= 0 ? "+" : "−"}{Math.abs(v).toFixed(1)}%
                        </span>;
                      })()}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <p className="fine">
            Peak and low are sampled while the pick is open and that league is on your board. Close is
            the last price seen before kickoff, so CLV is a strong read on your timing rather than an
            exact figure.
          </p>
        </div>
      )}
    </React.Fragment>
  );
}

/* ---------------- pricing ----------------
   The checkout call hits a server function holding the Stripe SECRET key.
   It can't live here — anything in this file is visible to every visitor.
   Deploy stripe-create-checkout as a Supabase Edge Function, then set this URL.
   profiles.plan is written only by the Stripe webhook; the browser can't grant
   itself Pro (column grants in migration 2 enforce that). */
const CHECKOUT_ENDPOINT = "";

function PricingPage({ account, onSignIn }){
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");

  const upgrade = async () => {
    if(!account.signedIn){ onSignIn(); return; }
    if(!CHECKOUT_ENDPOINT){
      setMsg("Checkout isn't connected yet — CHECKOUT_ENDPOINT is still empty in the code.");
      return;
    }
    setBusy(true); setMsg("");
    try{
      const { data:{ session } } = await sb.auth.getSession();
      const res = await fetch(CHECKOUT_ENDPOINT, {
        method:"POST",
        headers:{ "Content-Type":"application/json", Authorization:`Bearer ${session.access_token}` },
        body: JSON.stringify({ returnUrl: window.location.href }),
      });
      const json = await res.json();
      if(json.url) window.location.href = json.url;
      else setMsg(json.error || "Checkout didn't start. Try again.");
    }catch(e){
      setMsg(e.message);
    }finally{
      setBusy(false);
    }
  };

  return (
    <React.Fragment>
      <div className="page-head">
        <p className="eyebrow">Plans</p>
        <h1 className="page-title">Start free.<br/>Upgrade when it pays for itself.</h1>
        <p className="page-lede">
          One better price on one parlay usually covers the month. Everything on the free plan stays
          free — Pro adds props, exports, and takes the ads away.
        </p>
      </div>

      <div className="tiers">
        <div className="tier-card">
          <h3>Free</h3>
          <div className="cost">$0<small>/mo</small></div>
          <ul>
            <li>Every book, every game, unlimited</li>
            <li>Moneyline, spread and total comparison</li>
            <li>Parlay priced at each book you picked</li>
            <li>Promo boost math</li>
            <li>Pick history, P/L and CSV export</li>
            <li>5 prop loads a day</li>
            <li data-off="true">Closing line value</li>
            <li data-off="true">Unlimited props</li>
          </ul>
          <button className="btn" disabled>
            {account.isPro ? "Manage in billing portal" : "Your plan"}
          </button>
        </div>

        <div className="tier-card" data-featured="true">
          <span className="ribbon">Most useful</span>
          <h3>Pro</h3>
          <div className="cost">${PRO_PRICE}<small>/mo</small></div>
          <ul>
            <li>Everything in Free</li>
            <li><b>Closing line value on every pick</b> — whether you beat the number the market settled on</li>
            <li>Unlimited player and game props</li>
            <li>Peak, low and closing price per leg</li>
            <li>Priority refresh once the cache backend ships</li>
          </ul>
          <button className="btn btn-flare" onClick={upgrade} disabled={busy || account.isPro}>
            {account.isPro ? "You're on Pro" : busy ? "Opening checkout…" : `Upgrade — $${PRO_PRICE}/mo`}
          </button>
        </div>
      </div>

      <div className="prose-card" style={{marginTop:22}}>
        <h3>Why closing line value is the one worth paying for</h3>
        <p>
          Win-loss tells you what happened. It takes hundreds of bets before it tells you whether you're
          any good, because short runs are mostly luck.
        </p>
        <p>
          Closing line value skips the wait. If you took <span className="hl">+150</span> and the line
          closed at <span className="hl">+120</span>, you got a better number than the market landed on —
          and that shows up long before your record does. Beat the close consistently and the results
          follow. Stackd records the closing price on every leg you save and scores it for you.
        </p>
      </div>

      {msg && <p className="note" style={{marginTop:16}}>{msg}</p>}
    </React.Fragment>
  );
}
